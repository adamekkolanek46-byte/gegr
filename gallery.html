<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Galeria - Genzie</title>
<meta name="description" content="Galeria grupy Genzie - zdjęcia i wspomnienia.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--titanium:#F4F5F6;--carbon:#0D0E15;--volt:#D1FF00;--steel:#D9E0E4;--white:#fff;--ease:cubic-bezier(.16,1,.3,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--titanium);color:var(--carbon);-webkit-font-smoothing:antialiased;min-height:100svh}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) clamp(16px,4vw,40px) 12px;background:rgba(244,245,246,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--steel)}
.brand{font-weight:300;letter-spacing:.22em;font-size:13px;display:flex;align-items:center;gap:10px}
.brand i{width:6px;height:6px;border-radius:50%;background:var(--volt);box-shadow:0 0 0 1px rgba(13,14,21,.35)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;min-width:44px;padding:0 14px;border:1px solid var(--steel);background:var(--white);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;transition:background .4s var(--ease),border-color .4s var(--ease)}
.btn:hover,.btn:focus-visible{background:var(--volt);border-color:var(--carbon);outline:none}
.btn svg{width:16px;height:16px;flex:none}
.head{padding:clamp(32px,7vw,72px) clamp(16px,4vw,40px) 24px}
.eyebrow{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.35em;text-transform:uppercase;background:var(--volt);padding:6px 12px 6px 16px;margin-bottom:18px}
h1{font-size:clamp(40px,9vw,110px);font-weight:800;letter-spacing:-.04em;line-height:.95}
.head p{margin-top:18px;max-width:520px;font-size:15px;line-height:1.7;color:#4B515C}
.grid{column-count:4;column-gap:10px;padding:8px clamp(16px,4vw,40px) 40px}
.item{position:relative;display:block;width:100%;margin-bottom:10px;break-inside:avoid;overflow:hidden;background:var(--steel);padding:0}
.item img{width:100%;height:auto;transition:transform .9s var(--ease)}
.item:hover img{transform:scale(1.05)}
.item::after{content:attr(data-n);position:absolute;left:0;bottom:0;padding:5px 9px;background:var(--volt);font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.15em}
.item:focus-visible{outline:2px solid var(--carbon);outline-offset:2px}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:24px clamp(16px,4vw,40px) calc(28px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--steel)}
.foot .mono{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#6A7077}
.soc{display:flex;flex-wrap:wrap;gap:8px}
.lb{position:fixed;inset:0;z-index:100;background:rgba(13,14,21,.95);display:none;align-items:center;justify-content:center;touch-action:none}
.lb.open{display:flex}
.lb img{max-width:100vw;max-height:100vh;max-height:100dvh;width:auto;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none}
.lb-btn{position:absolute;width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:rgba(244,245,246,.12);border:1px solid rgba(244,245,246,.3);color:var(--titanium);font-size:24px;line-height:1}
.lb-btn:hover,.lb-btn:focus-visible{background:var(--volt);color:var(--carbon);outline:none}
.lb-close{top:calc(14px + env(safe-area-inset-top,0px));right:14px}
.lb-prev{left:14px;top:50%;transform:translateY(-50%)}
.lb-next{right:14px;top:50%;transform:translateY(-50%)}
.lb-count{position:absolute;left:16px;top:calc(28px + env(safe-area-inset-top,0px));font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.2em;color:var(--titanium)}
@media(max-width:1000px){.grid{column-count:3}}
@media(max-width:640px){.grid{column-count:2;column-gap:6px}.item{margin-bottom:6px}.btn span{display:none}.foot .btn span{display:inline}}
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="test.html"><i></i>Genzie</a>
  <a class="btn" href="test.html" aria-label="Wróć na stronę główną">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Strona główna</span>
  </a>
</header>

<section class="head">
  <p class="eyebrow">Galeria</p>
  <h1>WSPOMNIENIA</h1>
  <p>Zdjęcia z naszych spotkań w jednym miejscu. Kliknij zdjęcie, żeby je powiększyć.</p>
</section>

<main class="grid">
    <button class="item" type="button" data-n="01" aria-label="Powiększ zdjęcie 1"><img src="images/nexus-macro.jpg" alt="Zdjęcie 1" loading="lazy" decoding="async"></button>
    <button class="item" type="button" data-n="02" aria-label="Powiększ zdjęcie 2"><img src="images/nexus-core.jpg" alt="Zdjęcie 2" loading="lazy" decoding="async"></button>
    <button class="item" type="button" data-n="03" aria-label="Powiększ zdjęcie 3"><img src="images/nexus-flux.jpg" alt="Zdjęcie 3" loading="lazy" decoding="async"></button>
    <button class="item" type="button" data-n="04" aria-label="Powiększ zdjęcie 4"><img src="images/nexus-grid.jpg" alt="Zdjęcie 4" loading="lazy" decoding="async"></button>
    <button class="item" type="button" data-n="05" aria-label="Powiększ zdjęcie 5"><img src="images/nexus-sync.jpg" alt="Zdjęcie 5" loading="lazy" decoding="async"></button>
    <button class="item" type="button" data-n="06" aria-label="Powiększ zdjęcie 6"><img src="images/nexus-tab-core.jpg" alt="Zdjęcie 6" loading="lazy" decoding="async"></button>
    <button class="item" type="button" data-n="07" aria-label="Powiększ zdjęcie 7"><img src="images/nexus-tab-fluidics.jpg" alt="Zdjęcie 7" loading="lazy" decoding="async"></button>
    <button class="item" type="button" data-n="08" aria-label="Powiększ zdjęcie 8"><img src="images/nexus-tab-sync.jpg" alt="Zdjęcie 8" loading="lazy" decoding="async"></button>
</main>

<footer class="foot">
  <span class="mono">Genzie / Dołącz do nas</span>
  <div class="soc">
    <!-- PODMIEŃ linki na swoje -->
    <a class="btn" href="https://www.instagram.com/TWOJ_NICK" target="_blank" rel="noopener">Instagram</a>
    <a class="btn" href="https://www.tiktok.com/@TWOJ_NICK" target="_blank" rel="noopener">TikTok</a>
    <a class="btn" href="https://m.me/TWOJ_NICK" target="_blank" rel="noopener">Messenger</a>
  </div>
</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Podgląd zdjęcia">
  <span class="lb-count" id="lbCount">01 / 08</span>
  <img id="lbImg" src="" alt="">
  <button class="lb-btn lb-close" id="lbClose" type="button" aria-label="Zamknij">&times;</button>
  <button class="lb-btn lb-prev" id="lbPrev" type="button" aria-label="Poprzednie zdjęcie">&#8249;</button>
  <button class="lb-btn lb-next" id="lbNext" type="button" aria-label="Następne zdjęcie">&#8250;</button>
</div>

<script>
(function () {
  "use strict";
  var items = Array.prototype.slice.call(document.querySelectorAll(".item"));
  var lb = document.getElementById("lb"), lbImg = document.getElementById("lbImg"), lbCount = document.getElementById("lbCount");
  var idx = 0;

  function show(i) {
    idx = (i + items.length) % items.length;
    var im = items[idx].querySelector("img");
    lbImg.src = im.getAttribute("src");
    lbImg.alt = im.getAttribute("alt") || "";
    lbCount.textContent = String(idx + 1).padStart(2, "0") + " / " + String(items.length).padStart(2, "0");
  }
  function open(i) { show(i); lb.classList.add("open"); lb.setAttribute("aria-hidden", "false"); document.body.style.overflow = "hidden"; }
  function close() { lb.classList.remove("open"); lb.setAttribute("aria-hidden", "true"); document.body.style.overflow = ""; }

  items.forEach(function (it, i) { it.addEventListener("click", function () { open(i); }); });
  document.getElementById("lbClose").addEventListener("click", close);
  document.getElementById("lbPrev").addEventListener("click", function () { show(idx - 1); });
  document.getElementById("lbNext").addEventListener("click", function () { show(idx + 1); });
  lb.addEventListener("click", function (e) { if (e.target === lb) { close(); } });

  document.addEventListener("keydown", function (e) {
    if (!lb.classList.contains("open")) { return; }
    if (e.key === "Escape") { close(); }
    else if (e.key === "ArrowLeft") { show(idx - 1); }
    else if (e.key === "ArrowRight") { show(idx + 1); }
  });

  var tx = 0, ty = 0;
  lb.addEventListener("touchstart", function (e) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  lb.addEventListener("touchend", function (e) {
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { show(idx + (dx < 0 ? 1 : -1)); }
    else if (dy > 90 && Math.abs(dy) > Math.abs(dx)) { close(); }
  }, { passive: true });
})();
</script>
</body>
</html>
