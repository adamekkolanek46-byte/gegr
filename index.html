<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Przerwa techniczna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--titanium:#F4F5F6;--carbon:#0D0E15;--volt:#D1FF00;--steel:#D9E0E4;--ease:cubic-bezier(.16,1,.3,1)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--titanium);color:var(--carbon);overflow:hidden;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;min-height:100svh}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--steel) 1px,transparent 1px),linear-gradient(90deg,var(--steel) 1px,transparent 1px);background-size:80px 80px;opacity:.35}
.glass{position:absolute;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);background:rgba(255,255,255,.35);border:1px solid var(--steel)}
.a{width:220px;height:220px;top:12%;left:8%;border-radius:32px;animation:bobA 9s ease-in-out infinite}
.b{width:150px;height:150px;bottom:18%;right:10%;border-radius:50%;animation:bobB 7s ease-in-out infinite}
.c{width:110px;height:110px;top:20%;right:22%;border-radius:20px;animation:bobC 11s ease-in-out infinite}
@keyframes bobA{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}
@keyframes bobB{0%,100%{transform:translateY(0)}50%{transform:translateY(22px)}}
@keyframes bobC{0%,100%{transform:translateY(0) rotate(18deg)}50%{transform:translateY(-18px) rotate(24deg)}}
.stage{position:relative;z-index:5;text-align:center;padding:0 24px}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.4em;text-transform:uppercase;background:var(--volt);display:inline-block;padding:7px 14px 7px 18px;margin-bottom:28px}
h1{font-size:clamp(44px,10vw,140px);font-weight:800;letter-spacing:-.04em;line-height:.95}
p.sub{margin:32px auto 0;max-width:480px;font-size:16px;line-height:1.7;color:#4B515C}
.bar{margin:40px auto 0;width:min(320px,80%);height:4px;background:var(--steel);overflow:hidden;position:relative}
.bar::after{content:"";position:absolute;top:0;left:0;height:100%;width:35%;background:var(--carbon);animation:slide 1.8s var(--ease) infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.status{margin-top:18px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#6A7077}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--volt);border:1px solid var(--carbon);margin-right:10px;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
@media(max-width:600px){.a{width:140px;height:140px}.c{display:none}}
</style>
</head>
<body>
<div class="grid" aria-hidden="true"></div>
<div class="glass a" aria-hidden="true"></div>
<div class="glass b" aria-hidden="true"></div>
<div class="glass c" aria-hidden="true"></div>
<main class="stage">
  <p class="eyebrow">Prace serwisowe</p>
  <h1>PRZERWA<br>TECHNICZNA</h1>
  <p class="sub">Strona jest chwilowo niedostępna, ponieważ wprowadzamy ulepszenia. Wrócimy najszybciej, jak się da. Dziękujemy za cierpliwość.</p>
  <div class="bar" aria-hidden="true"></div>
  <p class="status"><span class="dot"></span>Wracamy wkrótce</p>
</main>
</body>
</html>
