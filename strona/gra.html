function cloudEnabled(){
 return Boolean(supabaseConfig.url&&supabaseConfig.anonKey);
}
function cloudSession(){
 try{return JSON.parse(localStorage.getItem(sessionKey))}catch{return null}
}
async function supabaseRequest(path,options={},token=""){
 const headers={
  "apikey":supabaseConfig.anonKey,
  "Authorization":"Bearer "+(token||supabaseConfig.anonKey),
  "Content-Type":"application/json",
  ...(options.headers||{})
 };
 const response=await fetch(supabaseConfig.url.replace(/\/$/,"")+"/"+path,{...options,headers});
 const data=response.status===204?null:await response.json().catch(()=>null);
 if(!response.ok) throw new Error(data?.msg||data?.message||data?.error_description||"Nie udało się połączyć z Supabase.");
 return data;
}
function queueCloudSave(){
 const session=cloudSession();
 if(!cloudEnabled()||!session?.access_token||!session?.user?.id) return;
 clearTimeout(cloudTimer);
 cloudTimer=setTimeout(()=>cloudSave().catch(()=>{}),700);
}
async function cloudSave(){
 const session=cloudSession();
 if(!session?.access_token||!state) return;
 await supabaseRequest("rest/v1/game_saves?on_conflict=user_id",{
  method:"POST",
  headers:{"Prefer":"resolution=merge-duplicates,return=minimal"},
  body:JSON.stringify({user_id:session.user.id,save_data:state,updated_at:new Date().toISOString()})
 },session.access_token);
}
async function cloudLoad(){
 const session=cloudSession();
 if(!session?.access_token) throw new Error("Najpierw zaloguj się na konto.");
 const rows=await supabaseRequest("rest/v1/game_saves?select=save_data&user_id=eq."+encodeURIComponent(session.user.id)+"&limit=1",{},session.access_token);
 if(!rows?.[0]?.save_data) throw new Error("Na tym koncie nie ma jeszcze zapisu.");
 state=rows[0].save_data;
 localStorage.setItem(key,JSON.stringify(state));
}
async function accountLogin(email,password){
 const session=await supabaseRequest("auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email,password})});
 localStorage.setItem(sessionKey,JSON.stringify(session));
 if(state) await cloudSave();
}
async function accountRegister(email,password){
 const result=await supabaseRequest("auth/v1/signup",{method:"POST",body:JSON.stringify({email,password})});
 if(result?.access_token) localStorage.setItem(sessionKey,JSON.stringify(result));
 return result;
}
function accountLogout(){
 localStorage.removeItem(sessionKey);
 accountScreen();
}

  node("p","Obsługa Supabase jest przygotowana. Po wpisaniu adresu projektu i publicznego klucza anon pojawi się rejestracja, logowanie i synchronizacja zapisu.",panel);
  button("← Wróć do menu",menu,panel);
  return;
 }
 const session=cloudSession();
 if(session?.user?.email){
  node("p","Zalogowano jako "+session.user.email+". Postęp zapisuje się lokalnie i w chmurze.",panel);
  const status=node("div","Gotowe do synchronizacji.",panel);status.className="account-status";
  const buttons=node("div","",panel);buttons.className="account-buttons";
  button("Wyślij zapis do chmury",async()=>{status.textContent="Zapisywanie…";try{await cloudSave();status.textContent="Zapis wysłany do chmury."}catch(error){status.textContent=error.message}},buttons);
  button("Pobierz zapis z chmury",async()=>{status.textContent="Pobieranie…";try{await cloudLoad();status.textContent="Zapis pobrany. Możesz kontynuować grę."}catch(error){status.textContent=error.message}},buttons);
  button("Wyloguj",accountLogout,buttons);
 }else{
  const form=node("form","",panel);form.className="account-form";
  const email=node("input","",node("label","E-mail",form));email.type="email";email.required=true;email.autocomplete="email";
  const password=node("input","",node("label","Hasło",form));password.type="password";password.required=true;password.minLength=8;password.autocomplete="current-password";
  const status=node("div","Hasło powinno mieć co najmniej 8 znaków.",form);status.className="account-status";
  const buttons=node("div","",form);buttons.className="account-buttons";
  button("Zaloguj się",async()=>{if(!email.reportValidity()||!password.reportValidity())return;status.textContent="Logowanie…";try{await accountLogin(email.value,password.value);accountScreen()}catch(error){status.textContent=error.message}},buttons);
  button("Załóż konto",async()=>{if(!email.reportValidity()||!password.reportValidity())return;status.textContent="Tworzenie konta…";try{const result=await accountRegister(email.value,password.value);status.textContent=result?.access_token?"Konto utworzone i zalogowane.":"Sprawdź e-mail, aby potwierdzić konto."}catch(error){status.textContent=error.message}},buttons);
 }
 button("← Wróć do menu",menu,panel);
}
function creator(){
 reset();
 backdrop("home");
 const form=node("form",""); form.className="creator";
 const label=node("span","Kreator bohatera",form);label.className="eyebrow";
 node("h2","To twoja historia",form);
 const grid=node("div","",form); grid.className="creator-grid";
 const preview=node("div","",grid);
 const fields=node("div","",grid);fields.className="creator-fields";
 const name=node("input","",node("label","Imię",fields));
 name.required=true; name.maxLength=24; name.autocomplete="off";
 function select(label,options){
  const field=node("select","",node("label",label,fields));
  options.forEach(([value,text])=>{node("option",text,field).value=value;});
  return field;
 }
 const hair=select("Fryzura",[[0,"Gładka"],[1,"Krótka"],[2,"Długa"]]);
 const outfit=select("Kolor bluzy",[["#a53f73","Różowa"],["#395e99","Niebieska"],["#347459","Zielona"]]);
 function player(){return {name:name.value.trim(),hair:Number(hair.value),color:outfit.value};}
 function update(){preview.replaceChildren(); portrait(player(),preview);}
 form.addEventListener("change",update); update();
 const submit=node("button","Zacznij odcinek  →",fields);submit.type="submit";
 button("Wróć",menu,fields);
 form.addEventListener("submit",event=>{
  event.preventDefault();
  if(!name.value.trim()){name.setCustomValidity("Wpisz imię.");name.reportValidity();return;}
  if((load() || state) && !confirm("Rozpocząć nową grę i zastąpić poprzedni zapis?")) return;
  state={version:1,player:player(),scores:people.map(()=>0),seen:people.map(()=>false),moments:people.map(()=>false),messages:people.map(()=>false),route:null,scene:"mode",location:0,chapter:1,storyIndex:0,clues:0,flags:[],gameMode:"",modeIndex:0};
  go("mode");
 });
 name.addEventListener("input",()=>name.setCustomValidity(""));
}
function showModeSelect(){
 backdrop("home");
 const panel=node("div","");panel.className="mode-panel";
 const label=node("span","Wybierz wersję rozgrywki",panel);label.className="eyebrow";
 node("h2","Jak potoczy się twoja historia?",panel);
 node("p","Każda wersja ma własne sceny w odcinkach 2 i 3, inne premie do relacji oraz odmienny finał.",panel);
 const grid=node("div","",panel);grid.className="mode-grid";
 Object.entries(gameModes).forEach(([id,mode])=>{
  const card=button("",()=>chooseMode(id),grid);card.className="mode-card";
  const icon=node("span",mode.icon,card);icon.className="mode-icon";
  node("strong",mode.title,card);
  node("small",mode.description,card);
 });
 button("← Wróć do kreatora",creator,panel);
}
function chooseMode(id){
 state.gameMode=id;
 state.flags=[gameModes[id].flag];
 state.clues=id==="mystery"?2:0;
 go("intro");
}
function modeAffinityBonus(id){
 const mode=gameModes[state.gameMode];
 return mode&&mode.bonus.includes(id)?8:0;
}
function go(scene){state.scene=scene;save();play();}
function play(){
 reset();
 state.moments=state.moments || people.map(()=>false);
 state.messages=state.messages || people.map(()=>false);
 state.chapter=state.chapter || 1;
 state.storyIndex=Number.isInteger(state.storyIndex)?state.storyIndex:0;
 state.clues=state.clues || 0;
 state.flags=state.flags || [];
 if(!state.gameMode&&state.scene!=="mode") state.gameMode="romance";
 episodeLabel.textContent="Warszawa · odcinek "+state.chapter;
 const placeIndex=Number.isInteger(state.location)?state.location:0;
 const backgrounds=["school","school","mall","park","river","home"];
 backdrop(state.scene==="map"?"map":backgrounds[placeIndex] || "school");
 if(storageError){const warning=node("div","Zapis jest dostępny do zamknięcia strony.");warning.className="toast";}
 switch(state.scene){
  case "intro":
   const layout=node("div","");layout.className="vn-layout";
   portrait(state.player,layout);
   const panel=node("div","",layout);panel.className="vn-panel";
   const speaker=node("span",state.player.name,panel);speaker.className="speaker";
   node("h2","Pierwszy dzwonek",panel);
   node("p","Na wejściu do liceum dostajesz plan lekcji i zaproszenie na próbę szkolnego radia. Do końca dnia chcesz poznać klasę i odkryć, kto schował twoje zgłoszenie.",panel);
   button("Otwórz mapę Warszawy  →",()=>go("map"),panel);
   break;
  case "mode": showModeSelect(); break;
  case "map": showMap(); break;
  case "location": showLocation(); break;
  case "dialogue": showDialogue(); break;
  case "phone": showPhone(); break;
  case "message": showMessage(); break;
  case "storyIntro": showStoryIntro(); break;
  case "modeStory": showModeStory(); break;
  case "story": showStory(); break;
  case "chapterComplete": showChapterComplete(); break;
  case "finale": showFinale(); break;
  case "evening": showEvening(); break;
  case "ending": showEnding(); break;
 }
 if(state.scene!=="intro"){
  const nav=node("div","");nav.className="actions";
  button("♡ Relacje",relations,nav);
  button("▣ Telefon",()=>go("phone"),nav);
  button("⌂ Menu główne",menu,nav);
 }
}
function showMap(){
 const shell=node("div","");shell.className="map-shell";
 const title=node("div","",shell);title.className="map-title";
 const label=node("span","Wybierz cel podróży",title);label.className="eyebrow";
 node("h2","Mapa Warszawy",title);
 const map=node("div","",shell);map.className="map";
 locations.forEach((place,index)=>{
  const card=node("div","",map);card.className="card";
  const pin=node("span","",card);pin.className="map-pin";pin.innerHTML="<span>"+["🏫","★","✿","≈","⌂"][index]+"</span>";
  const travel=button(place.name,()=>{state.location=index;go("location");},card);
  travel.disabled=index>0&&index<4&&!state.seen[0];
  if(travel.disabled) node("small","Najpierw porozmawiaj z Martyną w liceum.",card);
  else if(place.cast.length) node("small",place.cast.filter(id=>state.seen[id]).length+" / "+place.cast.length+" rozmów",card);
 });
}
function showLocation(){
 const place=locations[state.location];
 const panel=node("div","");panel.className="location-panel";
 const label=node("span","Teraz jesteś tutaj",panel);label.className="eyebrow";
 node("h2",place.name,panel);node("p",place.detail,panel);
 const cast=node("div","",panel);cast.className="location-cast";
 place.cast.forEach(id=>{
  let text="♡ Poznaj: "+people[id].name;
  if(state.seen[id]&&!state.moments[id]) text="✦ Dodatkowa scena: "+people[id].name;
  if(state.moments[id]) text="✓ "+people[id].name;
  const talk=button(text,()=>{state.speaker=id;state.interaction=state.seen[id]?"moment":"intro";go("dialogue");},cast);
  talk.disabled=state.moments[id];
 });
 if(!place.cast.length){
  button("Zakończ pierwszy dzień",()=>go("evening"),panel).disabled=!state.seen.every(Boolean);
 }
 const done=state.seen.filter(Boolean).length;
 const progress=node("div","",panel);progress.className="progress";progress.innerHTML='<i style="width:'+(done/people.length*100)+'%"></i>';
 node("small","Poznane osoby: "+done+" / "+people.length,panel);
 button("← Wróć na mapę",()=>go("map"),panel);
}
function showDialogue(){
 const id=state.speaker, person=people[id];
 const layout=node("div","");layout.className="vn-layout";
 portrait(person,layout);
 const panel=node("div","",layout);panel.className="vn-panel";
 const speaker=node("span",person.name,panel);speaker.className="speaker";
 const isMoment=state.interaction==="moment";
 node("p",isMoment?person.moment:person.intro,panel);
 const choices=node("div","",panel);choices.className="choices";
 const answers=isMoment?person.momentChoices:[[person.kind,35],["Możemy porozmawiać o tym później.",10],["Nie chcę się w to mieszać.",-20]];
 answers.forEach(([line,score])=>button(line,()=>{
  state.scores[id]=isMoment?Math.min(100,state.scores[id]+score):Math.min(100,score+modeAffinityBonus(id));
  state.seen[id]=true;
  if(isMoment) state.moments[id]=true;
  go("location");
 },choices));
 button("← Wróć do lokacji",()=>go("location"),panel);
}
function showPhone(){
 backdrop("home");
 const phone=node("div","");phone.className="phone";
 const label=node("span","Twój telefon",phone);label.className="eyebrow";
 node("h2","Wiadomości",phone);
 const list=node("div","",phone);list.className="phone-list";
 people.forEach((person,id)=>{
  if(!state.seen[id]) return;
  const chat=button("",()=>{state.phoneSpeaker=id;go("message");},list);chat.className="phone-chat";
  const avatar=node("span",person.name[0],chat);avatar.className="avatar";avatar.style.background=person.color;
  const copy=node("span","",chat);
  node("strong",person.name,copy);
  node("small",state.messages[id]?"Odpowiedź wysłana ✓":"Nowa wiadomość",copy);
  node("span",state.messages[id]?"✓":"›",chat);
 });
 if(!state.seen.some(Boolean)) node("p","Poznaj kogoś na mapie, aby rozpocząć rozmowę.",phone);
 button("← Wróć do gry",play,phone);
}
function showMessage(){
 const id=state.phoneSpeaker,person=people[id];
 const layout=node("div","");layout.className="vn-layout";
 portrait(person,layout);
 const panel=node("div","",layout);panel.className="vn-panel";
 const speaker=node("span",person.name+" · online",panel);speaker.className="speaker";
 node("p",person.message,panel);
 if(!state.messages[id]){
  const choices=node("div","",panel);choices.className="choices";
  [["Odpisuję ciepło i proponuję kolejne spotkanie.",8],["Wysyłam zabawne emoji i krótką odpowiedź.",5],["Odczytuję wiadomość bez odpowiedzi.",0]].forEach(([line,score])=>button(line,()=>{
   state.scores[id]=Math.min(100,state.scores[id]+score);
   state.messages[id]=true;
   go("phone");
  },choices));
 }else{
  const badge=node("span","✓ Odpowiedź została wysłana",panel);badge.className="interaction-badge";
  button("← Wróć do wiadomości",()=>go("phone"),panel);
 }
}
function showEvening(){
 const panel=node("div","");panel.className="location-panel";
 const label=node("span","22:14 · nowe wiadomości",panel);label.className="eyebrow";
 node("h2","Kto chodzi ci po głowie?",panel);
 node("p","Zaproś na spotkanie osobę, z którą masz co najmniej 35 punktów sympatii.",panel);
 people.forEach((person,id)=>{
  button("♡ "+person.name,()=>{state.route=id;go("ending");},panel).disabled=state.scores[id]<35;
 });
 button("Spędź wieczór po swojemu",()=>{state.route=null;go("ending");},panel);
 button("← Wróć na mapę",()=>go("map"),panel);
}
function showEnding(){
 const person=people[state.route];
 const layout=node("div","");layout.className="vn-layout";
 if(person){
  portrait(person,layout);
  const panel=node("div","",layout);panel.className="vn-panel";
  const speaker=node("span","♡ "+person.name,panel);speaker.className="speaker";
  node("p",person.date,panel);
  node("small","Koniec pierwszego odcinka",panel);
  button("Rozpocznij odcinek 2  →",()=>startEpisode(2),panel);
  button("Wróć do wyboru spotkania",()=>{state.route=null;go("evening");},panel);
 }else{
  portrait(state.player,layout);
  const panel=node("div","",layout);panel.className="vn-panel";
  node("h2","Wieczór dla siebie",panel);
  node("p","Odkładasz telefon i patrzysz przez okno. Jutro znów odezwie się szkolny dzwonek.",panel);
  node("small","Koniec pierwszego odcinka",panel);
  button("Rozpocznij odcinek 2  →",()=>startEpisode(2),panel);
  button("Wróć do wyboru spotkania",()=>{state.route=null;go("evening");},panel);
 }
}
function startEpisode(chapter){
 state.chapter=chapter;
 state.storyIndex=0;
 state.modeIndex=0;
 state.scene="storyIntro";
 save();
 play();
}
function showStoryIntro(){
 const episode=episodes[state.chapter];
 backdrop(state.chapter===2?"home":"school");
 const card=node("div","");card.className="chapter-card";
 const number=node("div","Odcinek "+state.chapter,card);number.className="chapter-number";
 node("h2",episode.title,card);
 node("p",episode.subtitle,card);
 const route=people[activeRoute()];
 const note=node("div","W tej części najbliżej będzie ci do: "+route.name+". Twoje kolejne decyzje mogą jeszcze zmienić poziom sympatii.",card);note.className="route-note";
 button("Zaczynamy  →",()=>go("modeStory"),card);
}
function activeRoute(){
 if(Number.isInteger(state.route)) return state.route;
 let best=0;
 state.scores.forEach((score,id)=>{if(score>state.scores[best]) best=id;});
 return best;
}
function showModeStory(){
 const scenes=modeScenes[state.gameMode]?.[state.chapter] || [];
 const scene=scenes[state.modeIndex];
 if(!scene){go("story");return;}
 backdrop(scene.bg || "school");
 let panel;
 if(Number.isInteger(scene.speaker)){
  const layout=node("div","");layout.className="vn-layout";
  portrait(people[scene.speaker],layout);
  panel=node("div","",layout);panel.className="vn-panel";
  const speaker=node("span",people[scene.speaker].name,panel);speaker.className="speaker";
 }else{
  panel=node("div","");panel.className="chapter-card";
  const speaker=node("span",scene.name || gameModes[state.gameMode].title,panel);speaker.className="speaker";
 }
 const label=node("span","Scena specjalna · "+gameModes[state.gameMode].title,panel);label.className="eyebrow";
 node("p",scene.text,panel);
 const choices=node("div","",panel);choices.className="choices";
 scene.choices.forEach(choice=>button(choice.label,()=>advanceModeStory(choice,scenes.length),choices));
}
function advanceModeStory(choice,total){
 applyChoiceEffects(choice);
 state.modeIndex+=1;
 state.scene=state.modeIndex>=total?"story":"modeStory";
 save();
 play();
}
function showStory(){
 const episode=episodes[state.chapter];
 const scene=episode.scenes[state.storyIndex];
 if(!scene){state.scene="chapterComplete";save();play();return;}
 backdrop(scene.bg || "school");
 const progress=Math.round((state.storyIndex+1)/episode.scenes.length*100);
 let panel;
 if(Number.isInteger(scene.speaker)){
  const layout=node("div","");layout.className="vn-layout";
  portrait(people[scene.speaker],layout);
  panel=node("div","",layout);panel.className="vn-panel";
  const speaker=node("span",people[scene.speaker].name,panel);speaker.className="speaker";
 }else{
  panel=node("div","");panel.className="chapter-card";
  const speaker=node("span",scene.name || "Narrator",panel);speaker.className="speaker";
 }
 const meta=node("div","",panel);meta.className="story-meta";
 const label=node("span","Odcinek "+state.chapter+" · scena "+(state.storyIndex+1)+" / "+episode.scenes.length,meta);label.className="eyebrow";
 const clues=node("span","Tropy: "+state.clues,meta);clues.className="clue-counter";
 node("p",scene.text,panel);
 const choices=node("div","",panel);choices.className="choices";
 (scene.choices || [{label:"Dalej  →"}]).forEach(choice=>button(choice.label,()=>advanceStory(choice),choices));
 const bar=node("div","",panel);bar.className="story-progress";bar.innerHTML='<i style="width:'+progress+'%"></i>';
}
function advanceStory(choice){
 applyChoiceEffects(choice);
 if(choice.finish){state.scene="finale";save();play();return;}
 state.storyIndex+=1;
 state.scene=state.storyIndex>=episodes[state.chapter].scenes.length?"chapterComplete":"story";
 save();
 play();
}
function applyChoiceEffects(choice){
 if(choice.affinity){
  const [id,points]=choice.affinity;
  state.scores[id]=Math.min(100,state.scores[id]+points);
 }
 if(choice.extraAffinity){
  const [id,points]=choice.extraAffinity;
  state.scores[id]=Math.min(100,state.scores[id]+points);
 }
 if(choice.routeBoost){
  const id=activeRoute();
  state.scores[id]=Math.min(100,state.scores[id]+choice.routeBoost);
 }
 if(choice.clues) state.clues+=choice.clues;
 if(choice.flag&&!state.flags.includes(choice.flag)) state.flags.push(choice.flag);
}
function showChapterComplete(){
 const episode=episodes[state.chapter];
 backdrop(state.chapter===2?"river":"home");
 const card=node("div","");card.className="chapter-card";
 const number=node("div","Odcinek "+state.chapter+" ukończony",card);number.className="chapter-number";
 node("h2",episode.title,card);
 node("p",state.chapter===2?"Macie dowody, ale Oskar rozpoczął zdalne kasowanie archiwum. Nocna akcja w szkole będzie jedyną szansą, by uratować radio.":"Nocna audycja dobiegła końca.",card);
 const note=node("div","Zebrane tropy: "+state.clues+" · Najwyższa sympatia: "+people[activeRoute()].name,card);note.className="route-note";
 if(state.chapter===2) button("Rozpocznij odcinek 3  →",()=>startEpisode(3),card);
}
function showFinale(){
 const id=activeRoute(),person=people[id];
 backdrop("river");
 const layout=node("div","");layout.className="vn-layout";
 portrait(person,layout);
 const panel=node("div","",layout);panel.className="vn-panel";
 const speaker=node("span","♡ "+person.name,panel);speaker.className="speaker";
 const lines=[
  "Martyna opuszcza aparat. „Dzisiaj nie potrzebuję zdjęcia. Chcę po prostu zapamiętać ten moment z tobą.”",
  "Adam splata swoje palce z twoimi. „Przy tobie nawet największy chaos zaczyna mieć sens.”",
  "Kasia wyciąga z kieszeni pasek z fotobudki. „Mówiłam, że zachowam go na następne spotkanie. Chyba właśnie nadeszło.”",
  "Antosia podaje ci nową kartkę. Tym razem na rysunku jesteście razem, a pod nim widnieje data nocnej audycji.",
  "Piotr zdejmuje słuchawki i uśmiecha się. „Najlepszy głos tej nocy wcale nie płynął z mikrofonu. Stał obok mnie.”",
  "Witek patrzy na światła odbite w Wiśle. „Nie cofnę swoich błędów, ale mogę codziennie pokazywać ci, że umiem być lepszy.”",
  "Błażej przestaje żartować. „Pierwszy raz nie chcę niczego udawać. Zależy mi na tobie. Naprawdę.”"
 ];
 const variantEndings={
  romance:"Wasza relacja stała się sercem całej historii. Kolejny sezon zacznie się od pierwszej prawdziwej randki.",
  mystery:"Dzięki zebranym dowodom odkrywasz każdy szczegół spisku. Szkolne radio proponuje ci prowadzenie własnego programu śledczego.",
  rebel:"Nocna akcja przechodzi do szkolnej legendy. Witek i Błażej stają się twoimi najbardziej nieprzewidywalnymi sojusznikami.",
  redemption:"Witek i Błażej zaczynają naprawiać szkody, a Oskar dostaje szansę powiedzenia prawdy bez kolejnego publicznego upokorzenia."
 };
 node("p",lines[id],panel);
 const variant=node("div",variantEndings[state.gameMode] || variantEndings.romance,panel);variant.className="route-note";
 const ending=state.flags.includes("mercy")?"Oskar przyjechał do studia i przyznał się na antenie. Radio ocalało, a prawda wybrzmiała bez publicznego upokorzenia.":"Dowody zostały wyemitowane, zanim Oskar zdążył usunąć archiwum. Następnego dnia szkoła rozpoczęła oficjalne wyjaśnianie sprawy.";
 const note=node("div",ending,panel);note.className="route-note";
 node("small","Koniec sezonu 1 · zebrane tropy: "+state.clues,panel);
 button("Wróć do menu",menu,panel);
}
function relations(){
 reset();
 backdrop("map");
 const label=node("span","Twój notes",screen);label.className="eyebrow";
 node("h2","Relacje");
 const grid=node("div","");grid.className="relations-grid";
 people.forEach((person,id)=>{
  const card=node("div","",grid);card.className="card";
  const head=node("div","",card);head.className="relation-head";
  const avatar=node("span",person.name[0],head);avatar.className="avatar";avatar.style.background=person.color;
  node("strong",person.name,head);
  node("small",state.seen[id]?"Sympatia "+state.scores[id]+" / 100":"Jeszcze bez rozmowy",card);
  const meter=node("div","",card);meter.className="heart-meter";meter.innerHTML='<i style="width:'+Math.max(0,state.scores[id])+'%"></i>';
  if(state.moments[id]) node("span","✦ wspólna scena",card).className="interaction-badge";
  if(state.messages[id]) node("span","▣ wiadomość",card).className="interaction-badge";
  if(state.route===id) node("small","♡ Umówione spotkanie",card);
 });
 button("Wróć do gry",play);
}
menu();
</script>
