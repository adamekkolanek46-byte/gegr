<!doctype html>
<html lang="pl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zauroczeni ♡</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@700;800&display=swap');
:root{--berry:#8d285d;--ink:#31233a;--cream:#fff9f3;--pink:#f4bfd4;--line:#ffffff8c}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:clamp(8px,2vw,22px);overflow-x:hidden;background:#21142d;color:var(--ink);font:16px 'DM Sans',sans-serif}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 18% 15%,#b14a79 0,transparent 28%),radial-gradient(circle at 84% 85%,#574699 0,transparent 30%),linear-gradient(145deg,#381d3d,#171526)}
body:after{content:"";position:fixed;inset:0;z-index:-1;opacity:.16;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:22px 22px}
main{position:relative;width:min(1180px,100%);height:min(760px,calc(100vh - 32px));min-height:650px;overflow:hidden;border:1px solid #ffffff59;border-radius:28px;background:#f8d8e5;box-shadow:0 26px 80px #07030b99,0 0 0 8px #ffffff0d}
header{position:absolute;z-index:30;top:0;left:0;right:0;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;color:#fff;background:linear-gradient(180deg,#3c213ecf,#3c213e00);pointer-events:none}
header strong{font:800 22px 'Playfair Display',serif;letter-spacing:.5px}header span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.8}
#screen{position:relative;height:100%;padding:72px clamp(18px,4vw,52px) 28px;overflow:auto;background-position:center;background-size:cover;isolation:isolate;transition:background .35s ease}
#screen:before{content:"";position:absolute;inset:0;z-index:-3;background:linear-gradient(155deg,#f6d5df,#dcb9d8 50%,#9b85b9)}
#screen.menu-bg:before{background:linear-gradient(#ffcbd6 0 50%,#e6839f 50%)}
#screen.school-bg:before{background:linear-gradient(#92cce8 0 43%,#dae3e5 43% 49%,#b66f65 49% 64%,#777b91 64% 66%,#afbac4 66%)}
#screen.mall-bg:before{background:linear-gradient(145deg,#bed7e5,#f4e7df 45%,#e7af91 46% 56%,#535966 57%)}
#screen.park-bg:before{background:linear-gradient(#93cae3 0 45%,#bfd99c 45% 63%,#75974d 63%)}
#screen.river-bg:before{background:linear-gradient(#f1b2c5 0 45%,#bba2ca 45% 53%,#658fa9 53% 72%,#7b8593 72%)}
#screen.home-bg:before{background:linear-gradient(135deg,#8a5f77 0 36%,#d6a981 36% 58%,#6f495e 58%)}
#screen:after{content:"";position:absolute;z-index:-2;inset:0;background:linear-gradient(180deg,#23112622 0 55%,#231126a6)}
#screen.menu-bg:after{background:linear-gradient(100deg,#fff8f5ed 0 45%,transparent 72%),linear-gradient(0deg,#35102c8c,transparent 42%)}
#screen.map-bg:after{background:linear-gradient(#fff9f4e8,#f9e4efe8)}
h1{max-width:600px;margin:70px 0 8px;font:800 clamp(58px,9vw,118px)/.86 'Playfair Display',serif;color:#8d285d;letter-spacing:-.06em;text-shadow:0 4px #fff,0 8px 18px #6b315b29}
h2{font:800 clamp(28px,4vw,48px)/1 'Playfair Display',serif;margin:0 0 14px;color:#65234d}p{max-width:700px;margin:0 0 16px;line-height:1.55}
button,input,select{font:inherit;border:0;border-radius:14px;padding:12px 16px;color:var(--ink)}
button{position:relative;background:linear-gradient(180deg,#fff,#f7d6e5);box-shadow:0 6px 16px #50244229,inset 0 0 0 1px #a44c7661;cursor:pointer;font-weight:700;margin:4px;transition:transform .18s,box-shadow .18s,filter .18s}
button:hover{transform:translateY(-2px);box-shadow:0 10px 20px #5024423d,inset 0 0 0 1px #a44c76}button:active{transform:translateY(0)}button:disabled{opacity:.5;filter:grayscale(.5);cursor:default;transform:none}
:focus-visible{outline:3px solid #fbda5e;outline-offset:3px}
label{display:grid;gap:6px;margin-bottom:14px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px}
.hero-copy{position:relative;z-index:2;max-width:620px}.eyebrow{display:inline-flex;padding:7px 12px;border-radius:999px;background:#ffffffb8;color:#7b345e;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 3px 12px #542b4b21}
.menu-actions{display:grid;width:min(330px,100%);gap:7px;margin-top:28px}.menu-actions button{margin:0;padding:15px 20px;text-align:left;font-size:17px}.menu-actions button:first-child{color:white;background:linear-gradient(135deg,#a8376c,#712653);box-shadow:0 12px 24px #7d2f5766}
.skyline{position:absolute;z-index:-1;right:0;bottom:0;width:58%;height:72%;opacity:.92;filter:drop-shadow(0 20px 20px #3d163a42)}
.cast-strip{position:absolute;right:3%;bottom:0;width:min(55%,560px);display:flex;align-items:flex-end;justify-content:center;gap:-12px;pointer-events:none}.cast-strip .mini-person{width:36%;margin-left:-12%;filter:drop-shadow(0 12px 8px #47193440)}.cast-strip .mini-person img{display:block;width:100%;height:auto}.cast-strip .mini-person:nth-child(2){width:42%;z-index:2}.cast-strip .mini-person:nth-child(3){width:37%}
.stage{position:relative;min-height:370px;display:flex;align-items:flex-end;justify-content:center;margin:-20px auto 0;overflow:visible;background:none;border:0}.stage svg,.stage img{height:min(54vh,500px);max-width:100%;object-fit:contain;filter:drop-shadow(0 22px 18px #26112469)}
.stage:after{content:"";position:absolute;bottom:5px;width:220px;height:22px;border-radius:50%;z-index:-1;background:#32152d42;filter:blur(10px)}
.vn-layout{min-height:100%;display:grid;grid-template-columns:minmax(260px,.75fr) minmax(380px,1.25fr);align-items:end;gap:20px}
.vn-panel{align-self:end;margin-bottom:44px;padding:24px 26px;border:1px solid #ffffff9c;border-radius:24px;background:#fff9f3e8;box-shadow:0 20px 50px #31132c57;backdrop-filter:blur(14px)}
.speaker{display:inline-flex;margin:-52px 0 13px;padding:8px 18px;border-radius:999px;background:linear-gradient(135deg,#a8376c,#6c2853);color:white;font:800 19px 'Playfair Display',serif;box-shadow:0 8px 18px #601e4b66}
.choices{display:grid;gap:7px}.choices button{margin:0;text-align:left;padding:13px 16px}.choices button:before{content:"♡";margin-right:9px;color:#b33570}
.card{padding:18px;background:#fff9f4e3;border:1px solid #fff;border-radius:18px;box-shadow:0 12px 25px #6537571f;backdrop-filter:blur(8px)}
.actions{position:relative;z-index:5;display:flex;flex-wrap:wrap;margin-top:14px}.actions button{padding:9px 13px;font-size:13px}small{display:block;margin-top:8px;color:#76536e}
.map-shell{position:relative;min-height:510px;padding:30px;border-radius:28px;overflow:hidden;background:#f7e7de;box-shadow:inset 0 0 0 1px #c391a5,0 18px 50px #54254233}
.map-shell:before{content:"";position:absolute;inset:0;opacity:.6;background:linear-gradient(68deg,transparent 20%,#fff 21% 24%,transparent 25% 62%,#fff 63% 66%,transparent 67%),linear-gradient(20deg,transparent 39%,#c1d8dd 40% 47%,transparent 48%),radial-gradient(circle at 38% 45%,#c9dfb5 0 11%,transparent 12%),#edcfbf}
.map-title{position:relative}.map{position:relative;min-height:390px}.map .card{position:absolute;width:210px;padding:10px}.map .card:nth-child(1){left:7%;top:12%}.map .card:nth-child(2){left:39%;top:4%}.map .card:nth-child(3){right:5%;top:27%}.map .card:nth-child(4){left:30%;bottom:4%}.map .card:nth-child(5){right:10%;bottom:2%}.map .card button{width:100%;margin:0}.map-pin{display:block;margin:-34px auto 5px;width:46px;height:46px;line-height:42px;text-align:center;border:3px solid white;border-radius:50% 50% 50% 8px;transform:rotate(-45deg);background:#9c3064;color:white;font-size:20px;box-shadow:0 5px 12px #5d294d4d}.map-pin span{display:block;transform:rotate(45deg)}
.location-panel{max-width:580px;margin:13vh 0 0;padding:28px;border-radius:24px;background:#fff9f3e8;box-shadow:0 20px 50px #2a152b59;backdrop-filter:blur(14px)}
.location-cast{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.location-cast button{margin:0}.progress{height:9px;margin-top:12px;overflow:hidden;border-radius:99px;background:#dbbdcb}.progress i{display:block;height:100%;background:linear-gradient(90deg,#b03e72,#7e4ba2);border-radius:inherit}
.creator{width:min(900px,100%);margin:2vh auto;padding:26px;border-radius:28px;background:#fff9f3e8;box-shadow:0 20px 60px #32152852;backdrop-filter:blur(15px)}.creator .stage{min-height:360px}.creator-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}.creator-fields{padding:20px}.creator-fields input,.creator-fields select{width:100%;background:#fff;border:1px solid #c69bad;box-shadow:inset 0 2px 5px #4f214b12}
.relations-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.relation-head{display:flex;align-items:center;gap:11px}.avatar{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;color:white;font-weight:800;border:3px solid white;box-shadow:0 4px 10px #0002}.heart-meter{height:8px;margin-top:12px;border-radius:99px;background:#ead0dc;overflow:hidden}.heart-meter i{display:block;height:100%;background:linear-gradient(90deg,#df6a9c,#9c2860)}
.toast{position:absolute;z-index:20;right:20px;top:66px;padding:9px 14px;border-radius:999px;background:#2d2134d9;color:white;font-size:12px}
.phone{width:min(760px,100%);margin:2vh auto;padding:25px;border-radius:32px;background:#f8edf3e8;box-shadow:0 25px 70px #32152866;backdrop-filter:blur(16px)}.phone-list{display:grid;gap:10px;margin:18px 0}.phone-chat{display:grid;grid-template-columns:50px 1fr auto;align-items:center;gap:12px;width:100%;margin:0;text-align:left}.phone-chat .avatar{font-size:16px}.phone-chat small{margin:2px 0 0}.interaction-badge{display:inline-flex;align-items:center;gap:6px;margin:4px;padding:7px 10px;border-radius:999px;background:#fff7;color:#783456;font-size:12px;font-weight:800}
@media(max-width:760px){body{padding:0}main{height:100vh;min-height:640px;border-radius:0;border:0}.vn-layout{display:block;padding-top:170px}.vn-layout .stage{position:absolute;top:70px;left:0;right:0;height:330px;min-height:0}.vn-layout .stage svg,.vn-layout .stage img{height:320px}.vn-panel{position:relative;margin:220px 0 20px;padding:20px}.cast-strip{right:-15%;width:85%;opacity:.55}.skyline{width:90%;height:55%}.map-shell{padding:20px 12px;min-height:560px}.map{display:grid;gap:12px;min-height:0}.map .card{position:relative!important;inset:auto!important;width:auto}.map-pin{display:none}.creator{padding:16px}.creator-grid{grid-template-columns:1fr}.creator .stage{min-height:240px}.creator .stage svg{height:250px}.creator-fields{padding:0}.location-panel{margin-top:10vh}h1{margin-top:80px}}
</style>
<main><header><strong>♡ Zauroczeni</strong><span>Warszawa · odcinek 1</span></header><section id="screen"></section></main>
<script>
"use strict";
const screen = document.querySelector("#screen");
const key = "zauroczeni.save.v1";
// Każdy portret jest osobnym plikiem, więc można go łatwo wymienić.
const people = [
 {name:"Martyna",color:"#a53f73",hair:2,image:"assets/characters/martyna.png",intro:"Mam zrobić kronikę pierwszego dnia. Pomożesz mi znaleźć coś ciekawszego niż zdjęcie tablicy?",kind:"Chodźmy poszukać razem.",moment:"Martyna ustawia aparat na parapecie. Mamy jedno zdjęcie na próbę. Jaką pozę wybierasz?",momentChoices:[["Robimy zabawną minę.",20],["Stańmy trochę bliżej.",25],["Może tylko ty?",5]],message:"Zdjęcie wyszło świetnie. Wyślę ci je, ale obiecaj, że nie wrzucisz go bez mojego filtra!",date:"Mam jeszcze jedno zdjęcie. Na nim jesteś tylko ty. Może jutro zrobimy wspólne?"},
 {name:"Adam",color:"#395e99",hair:1,image:"assets/characters/adam.png",intro:"Zgubiłem kartkę z planem zajęć. Znasz już drogę do sali od historii?",kind:"Pokażę ci. I tak idę w tamtą stronę.",moment:"Adam zatrzymuje się przy automacie z napojami. Wypada z niego ostatnie kakao. Co robisz?",momentChoices:[["Dzielimy się po połowie.",25],["Weź je, ja wybiorę herbatę.",15],["Wygrywa szybszy!",10]],message:"Dzięki za oprowadzenie. Jutro to ja pokażę ci najlepsze miejsce na przerwie.",date:"Dzięki tobie już znam drogę. Jutro mogę poczekać przed szkołą specjalnie na ciebie?"},
 {name:"Kasia",color:"#9b4b31",hair:2,image:"assets/characters/kasia.png",intro:"Mam dwa bilety do kina w Złotych. Koleżanka się rozchorowała. Lubisz beznadziejne komedie?",kind:"Jeśli idziemy razem, to nawet bardzo.",moment:"Przed seansem Kasia wyciąga cię do fotobudki. Na ekranie migają trzy motywy zdjęcia.",momentChoices:[["Serca i brokat.",25],["Klasyczne czarno-białe.",15],["Najdziwniejszy filtr.",20]],message:"Zachowałam oba paski z fotobudki. Twój dostaniesz przy następnym spotkaniu.",date:"Dobra, film był tragiczny. Za to z tobą chcę się spotkać jeszcze raz."},
 {name:"Antosia",color:"#347459",hair:1,image:"assets/characters/antosia.png",intro:"Szkicuję ławkę w Ogrodzie Saskim. Usiądziesz na chwilę, żebym mogła dorysować postać?",kind:"Usiądę. Pokażesz mi potem szkic?",moment:"Podmuch wiatru wyrywa szkic z notesu Antosi. Kartka ląduje przy fontannie.",momentChoices:[["Biegnę ją złapać.",20],["Osłaniam notes przed wiatrem.",15],["Proponuję narysować coś razem.",25]],message:"Dorysowałam na szkicu małe serce. Udawajmy, że znalazło się tam przypadkiem.",date:"Masz, zatrzymaj rysunek. Następnym razem chciałabym się tu spotkać bez szkicownika."},
 {name:"Piotr",color:"#794a9b",hair:0,image:"assets/characters/piotr.png",intro:"Przyniosłem termos herbaty na próbę szkolnego radia. Chcesz spróbować? Jest z goździkami.",kind:"Tak! Opowiesz mi przy okazji o audycji?",moment:"Piotr podaje ci słuchawki. Do rozpoczęcia próbnej audycji zostało dziesięć sekund.",momentChoices:[["Witam słuchaczy pewnym głosem.",20],["Przedstawiam nas jako duet.",25],["Oddaję mikrofon Piotrowi.",10]],message:"Twój głos brzmi świetnie w słuchawkach. Mam dla nas pomysł na stały duet.",date:"Jutro też przyniosę herbatę. Może tym razem spotkamy się tylko we dwoje?"},
 {name:"Witek",color:"#51616a",hair:1,image:"assets/characters/witek.png",intro:"To ja schowałem twoje zgłoszenie do radia. Była jedna wolna rola, a mnie zależało na tej audycji.",kind:"Oddaj zgłoszenie i wyjaśnij to Piotrowi. Potem możemy pogadać.",moment:"Witek przynosi zmiętą kartkę zgłoszenia. Widać, że trudno mu przyznać się do błędu.",momentChoices:[["Pomogę ci to wyjaśnić.",25],["Najpierw chcę szczerych przeprosin.",15],["Oddaj kartkę. Resztę załatwię.",5]],message:"Powiedziałem prawdę na grupie. Nie oczekuję, że od razu mi zaufasz, ale dzięki za szansę.",date:"Oddałem kartkę i powiedziałem Piotrowi prawdę. Chcę zacząć od nowa. Spotkamy się jutro?"},
 {name:"Błażej",color:"#a73741",hair:0,image:"assets/characters/blazej.png",intro:"Powiedziałem klasie, że uciekasz z pierwszej próby. Byłem zazdrosny, że zaprosili cię od razu.",kind:"Sprostuj plotkę. Jeśli to zrobisz, możemy zacząć od nowa.",moment:"Błażej pokazuje ci przygotowaną wiadomość z wyjaśnieniem plotki. Palec zatrzymuje mu się nad przyciskiem „wyślij”.",momentChoices:[["Wyślij. Zostanę obok.",25],["Poprawmy ją razem.",20],["To twoja odpowiedzialność.",10]],message:"Wiadomość wysłana. To było trudniejsze, niż chcę przyznać. Dzięki, że nie odeszłaś/odszedłeś.",date:"Sprostowałem to na grupie klasowej. Przepraszam. Dasz się jutro zaprosić na spacer?"}
];
const locations = [
 {name:"Liceum • Śródmieście",detail:"Tu zaczyna się pierwszy dzień i próba szkolnego radia.",cast:[0,1,4,5]},
 {name:"Złote Tarasy",detail:"Kasia czeka obok wejścia do kina.",cast:[2]},
 {name:"Ogród Saski",detail:"Przy fontannie widać Antosię ze szkicownikiem.",cast:[3]},
 {name:"Bulwary Wiślane",detail:"Błażej został przy schodach nad Wisłą.",cast:[6]},
 {name:"Mieszkanie",detail:"Możesz zakończyć dzień po rozmowie z całą siódemką.",cast:[]}
];
let state, storageError = false;
function load(){
 try { const saved = JSON.parse(localStorage.getItem(key)); return saved?.version === 1 ? saved : null; }
 catch { return null; }
}
function save(){
 try { localStorage.setItem(key,JSON.stringify(state)); storageError = false; }
 catch { storageError = true; }
}
function node(tag,text,parent=screen){
 const element=document.createElement(tag);
 if(text) element.textContent=text;
 parent.append(element);
 return element;
}
function button(text,action,parent=screen){
 const control=node("button",text,parent);
 control.type="button";
 control.addEventListener("click",action);
 return control;
}
function reset(){
 screen.replaceChildren();
 screen.className="";
}
function backdrop(name){ screen.className=name+"-bg"; }
function characterSvg(person){
 const hair=[
  '<path d="M57 32Q78 10 101 31Q94 14 76 13Q60 14 57 32" fill="#3b2638"/>',
  '<path d="M55 37Q54 9 80 8Q105 10 103 39L94 28Q77 31 61 23Z" fill="#35243b"/>',
  '<path d="M52 47Q45 10 79 7Q113 9 107 54L99 39Q94 68 100 82Q72 70 55 82Q61 61 57 38Z" fill="#4a293b"/>'
 ][person.hair] || "";
 return `<svg class="character-art" viewBox="0 0 160 310" aria-hidden="true">
  <defs><linearGradient id="shirt-${person.color.slice(1)}" x2="0" y2="1"><stop stop-color="${person.color}"/><stop offset="1" stop-color="#3c2742"/></linearGradient></defs>
  <path d="M47 295Q42 239 57 191H101Q118 241 112 295" fill="#322b48" stroke="#241d31" stroke-width="5"/>
  <path d="M54 190L33 268M103 190l28 78" fill="none" stroke="#ffd7bd" stroke-width="17" stroke-linecap="round"/>
  <path d="M47 295L34 306M112 295l16 11" fill="none" stroke="#241d31" stroke-width="11" stroke-linecap="round"/>
  <path d="M48 104Q38 137 45 199Q77 213 111 198Q117 140 105 104Z" fill="url(#shirt-${person.color.slice(1)})" stroke="#33213a" stroke-width="4"/>
  <path d="M58 108Q78 132 97 108" fill="none" stroke="#fff5" stroke-width="4"/>
  <circle cx="80" cy="62" r="43" fill="#ffd7bd" stroke="#35253a" stroke-width="4"/>
  ${hair}
  <ellipse cx="67" cy="64" rx="4" ry="6" fill="#382638"/><ellipse cx="93" cy="64" rx="4" ry="6" fill="#382638"/>
  <path d="M70 81Q80 89 91 80" fill="none" stroke="#9e4961" stroke-width="3" stroke-linecap="round"/>
  <path d="M48 112Q32 120 29 147M108 113q19 8 23 34" fill="none" stroke="${person.color}" stroke-width="20" stroke-linecap="round"/>
 </svg>`;
}
function portrait(person,parent){
 const stage=node("div","",parent);
 stage.className="stage";
 if(person.image){
  const image=node("img","",stage);
  image.src=person.image;
  image.alt=person.name;
  return;
 }
 stage.innerHTML=characterSvg(person);
}
function menu(){
 reset();
 backdrop("menu");
 const copy=node("div",""); copy.className="hero-copy";
 const label=node("span","Romantyczna visual novel",copy); label.className="eyebrow";
 node("h1","Zauroczeni",copy);
 node("p","Nowa szkoła. Siedem znajomości. Jedna Warszawa pełna sekretów.",copy);
 const actions=node("div","",copy); actions.className="menu-actions";
 button("▶  Nowa gra",creator,actions);
 const resume=button("♡  Kontynuuj historię",()=>{state=load() || state; play();},actions);
 resume.disabled=!(load() || state);
 const skyline=node("div",""); skyline.className="skyline";
 skyline.innerHTML='<svg viewBox="0 0 600 430" preserveAspectRatio="none" aria-hidden="true"><path d="M0 430V270h57v-64h45v49h39v-98h54v113h42V95h22V54h18V95h23v174h48V196h62v74h38V146h55v124h58v-83h59v243Z" fill="#724265"/><path d="M259 55h18M251 109h34M250 130h35M250 151h35M250 172h35" stroke="#ffd8e7" stroke-width="5"/><circle cx="490" cy="70" r="44" fill="#fff3bc" opacity=".75"/></svg>';
 const cast=node("div",""); cast.className="cast-strip";
 [people[1],people[0],people[2]].forEach(person=>{const art=node("div","",cast);art.className="mini-person";const image=node("img","",art);image.src=person.image;image.alt="";});
}
function creator(){
 reset();
 backdrop("home");
 const form=node("form",""); form.className="creator";
 const label=node("span","Kreator bohatera",form);label.className="eyebrow";
 node("h2","To twoja historia",form);
 const grid=node("div","",form); grid.className="creator-grid";
 const preview=node("div","",grid);
 const fields=node("div","",grid);fields.className="creator-fields";
 const name=node("input","",node("label","Imię",fields));
 name.required=true; name.maxLength=24; name.autocomplete="off";
 function select(label,options){
  const field=node("select","",node("label",label,fields));
  options.forEach(([value,text])=>{node("option",text,field).value=value;});
  return field;
 }
 const hair=select("Fryzura",[[0,"Gładka"],[1,"Krótka"],[2,"Długa"]]);
 const outfit=select("Kolor bluzy",[["#a53f73","Różowa"],["#395e99","Niebieska"],["#347459","Zielona"]]);
 function player(){return {name:name.value.trim(),hair:Number(hair.value),color:outfit.value};}
 function update(){preview.replaceChildren(); portrait(player(),preview);}
 form.addEventListener("change",update); update();
 const submit=node("button","Zacznij odcinek  →",fields);submit.type="submit";
 button("Wróć",menu,fields);
 form.addEventListener("submit",event=>{
  event.preventDefault();
  if(!name.value.trim()){name.setCustomValidity("Wpisz imię.");name.reportValidity();return;}
  if((load() || state) && !confirm("Rozpocząć nową grę i zastąpić poprzedni zapis?")) return;
  state={version:1,player:player(),scores:people.map(()=>0),seen:people.map(()=>false),moments:people.map(()=>false),messages:people.map(()=>false),route:null,scene:"intro",location:0};
  go("intro");
 });
 name.addEventListener("input",()=>name.setCustomValidity(""));
}
function go(scene){state.scene=scene;save();play();}
function play(){
 reset();
 state.moments=state.moments || people.map(()=>false);
 state.messages=state.messages || people.map(()=>false);
 const placeIndex=Number.isInteger(state.location)?state.location:0;
 const backgrounds=["school","school","mall","park","river","home"];
 backdrop(state.scene==="map"?"map":backgrounds[placeIndex] || "school");
 if(storageError){const warning=node("div","Zapis jest dostępny do zamknięcia strony.");warning.className="toast";}
 switch(state.scene){
  case "intro":
   const layout=node("div","");layout.className="vn-layout";
   portrait(state.player,layout);
   const panel=node("div","",layout);panel.className="vn-panel";
   const speaker=node("span",state.player.name,panel);speaker.className="speaker";
   node("h2","Pierwszy dzwonek",panel);
   node("p","Na wejściu do liceum dostajesz plan lekcji i zaproszenie na próbę szkolnego radia. Do końca dnia chcesz poznać klasę i odkryć, kto schował twoje zgłoszenie.",panel);
   button("Otwórz mapę Warszawy  →",()=>go("map"),panel);
   break;
  case "map": showMap(); break;
  case "location": showLocation(); break;
  case "dialogue": showDialogue(); break;
  case "phone": showPhone(); break;
  case "message": showMessage(); break;
  case "evening": showEvening(); break;
  case "ending": showEnding(); break;
 }
 if(state.scene!=="intro"){
  const nav=node("div","");nav.className="actions";
  button("♡ Relacje",relations,nav);
  button("▣ Telefon",()=>go("phone"),nav);
  button("⌂ Menu główne",menu,nav);
 }
}
function showMap(){
 const shell=node("div","");shell.className="map-shell";
 const title=node("div","",shell);title.className="map-title";
 const label=node("span","Wybierz cel podróży",title);label.className="eyebrow";
 node("h2","Mapa Warszawy",title);
 const map=node("div","",shell);map.className="map";
 locations.forEach((place,index)=>{
  const card=node("div","",map);card.className="card";
  const pin=node("span","",card);pin.className="map-pin";pin.innerHTML="<span>"+["🏫","★","✿","≈","⌂"][index]+"</span>";
  const travel=button(place.name,()=>{state.location=index;go("location");},card);
  travel.disabled=index>0&&index<4&&!state.seen[0];
  if(travel.disabled) node("small","Najpierw porozmawiaj z Martyną w liceum.",card);
  else if(place.cast.length) node("small",place.cast.filter(id=>state.seen[id]).length+" / "+place.cast.length+" rozmów",card);
 });
}
function showLocation(){
 const place=locations[state.location];
 const panel=node("div","");panel.className="location-panel";
 const label=node("span","Teraz jesteś tutaj",panel);label.className="eyebrow";
 node("h2",place.name,panel);node("p",place.detail,panel);
 const cast=node("div","",panel);cast.className="location-cast";
 place.cast.forEach(id=>{
  let text="♡ Poznaj: "+people[id].name;
  if(state.seen[id]&&!state.moments[id]) text="✦ Dodatkowa scena: "+people[id].name;
  if(state.moments[id]) text="✓ "+people[id].name;
  const talk=button(text,()=>{state.speaker=id;state.interaction=state.seen[id]?"moment":"intro";go("dialogue");},cast);
  talk.disabled=state.moments[id];
 });
 if(!place.cast.length){
  button("Zakończ pierwszy dzień",()=>go("evening"),panel).disabled=!state.seen.every(Boolean);
 }
 const done=state.seen.filter(Boolean).length;
 const progress=node("div","",panel);progress.className="progress";progress.innerHTML='<i style="width:'+(done/people.length*100)+'%"></i>';
 node("small","Poznane osoby: "+done+" / "+people.length,panel);
 button("← Wróć na mapę",()=>go("map"),panel);
}
function showDialogue(){
 const id=state.speaker, person=people[id];
 const layout=node("div","");layout.className="vn-layout";
 portrait(person,layout);
 const panel=node("div","",layout);panel.className="vn-panel";
 const speaker=node("span",person.name,panel);speaker.className="speaker";
 const isMoment=state.interaction==="moment";
 node("p",isMoment?person.moment:person.intro,panel);
 const choices=node("div","",panel);choices.className="choices";
 const answers=isMoment?person.momentChoices:[[person.kind,35],["Możemy porozmawiać o tym później.",10],["Nie chcę się w to mieszać.",-20]];
 answers.forEach(([line,score])=>button(line,()=>{
  state.scores[id]=isMoment?Math.min(100,state.scores[id]+score):score;
  state.seen[id]=true;
  if(isMoment) state.moments[id]=true;
  go("location");
 },choices));
 button("← Wróć do lokacji",()=>go("location"),panel);
}
function showPhone(){
 backdrop("home");
 const phone=node("div","");phone.className="phone";
 const label=node("span","Twój telefon",phone);label.className="eyebrow";
 node("h2","Wiadomości",phone);
 const list=node("div","",phone);list.className="phone-list";
 people.forEach((person,id)=>{
  if(!state.seen[id]) return;
  const chat=button("",()=>{state.phoneSpeaker=id;go("message");},list);chat.className="phone-chat";
  const avatar=node("span",person.name[0],chat);avatar.className="avatar";avatar.style.background=person.color;
  const copy=node("span","",chat);
  node("strong",person.name,copy);
  node("small",state.messages[id]?"Odpowiedź wysłana ✓":"Nowa wiadomość",copy);
  node("span",state.messages[id]?"✓":"›",chat);
 });
 if(!state.seen.some(Boolean)) node("p","Poznaj kogoś na mapie, aby rozpocząć rozmowę.",phone);
 button("← Wróć do gry",play,phone);
}
function showMessage(){
 const id=state.phoneSpeaker,person=people[id];
 const layout=node("div","");layout.className="vn-layout";
 portrait(person,layout);
 const panel=node("div","",layout);panel.className="vn-panel";
 const speaker=node("span",person.name+" · online",panel);speaker.className="speaker";
 node("p",person.message,panel);
 if(!state.messages[id]){
  const choices=node("div","",panel);choices.className="choices";
  [["Odpisuję ciepło i proponuję kolejne spotkanie.",8],["Wysyłam zabawne emoji i krótką odpowiedź.",5],["Odczytuję wiadomość bez odpowiedzi.",0]].forEach(([line,score])=>button(line,()=>{
   state.scores[id]=Math.min(100,state.scores[id]+score);
   state.messages[id]=true;
   go("phone");
  },choices));
 }else{
  const badge=node("span","✓ Odpowiedź została wysłana",panel);badge.className="interaction-badge";
  button("← Wróć do wiadomości",()=>go("phone"),panel);
 }
}
function showEvening(){
 const panel=node("div","");panel.className="location-panel";
 const label=node("span","22:14 · nowe wiadomości",panel);label.className="eyebrow";
 node("h2","Kto chodzi ci po głowie?",panel);
 node("p","Zaproś na spotkanie osobę, z którą masz co najmniej 35 punktów sympatii.",panel);
 people.forEach((person,id)=>{
  button("♡ "+person.name,()=>{state.route=id;go("ending");},panel).disabled=state.scores[id]<35;
 });
 button("Spędź wieczór po swojemu",()=>{state.route=null;go("ending");},panel);
 button("← Wróć na mapę",()=>go("map"),panel);
}
function showEnding(){
 const person=people[state.route];
 const layout=node("div","");layout.className="vn-layout";
 if(person){
  portrait(person,layout);
  const panel=node("div","",layout);panel.className="vn-panel";
  const speaker=node("span","♡ "+person.name,panel);speaker.className="speaker";
  node("p",person.date,panel);
  node("small","Koniec pierwszego odcinka",panel);
  button("Wróć do wyboru spotkania",()=>{state.route=null;go("evening");},panel);
 }else{
  portrait(state.player,layout);
  const panel=node("div","",layout);panel.className="vn-panel";
  node("h2","Wieczór dla siebie",panel);
  node("p","Odkładasz telefon i patrzysz przez okno. Jutro znów odezwie się szkolny dzwonek.",panel);
  node("small","Koniec pierwszego odcinka",panel);
  button("Wróć do wyboru spotkania",()=>{state.route=null;go("evening");},panel);
 }
}
function relations(){
 reset();
 backdrop("map");
 const label=node("span","Twój notes",screen);label.className="eyebrow";
 node("h2","Relacje");
 const grid=node("div","");grid.className="relations-grid";
 people.forEach((person,id)=>{
  const card=node("div","",grid);card.className="card";
  const head=node("div","",card);head.className="relation-head";
  const avatar=node("span",person.name[0],head);avatar.className="avatar";avatar.style.background=person.color;
  node("strong",person.name,head);
  node("small",state.seen[id]?"Sympatia "+state.scores[id]+" / 100":"Jeszcze bez rozmowy",card);
  const meter=node("div","",card);meter.className="heart-meter";meter.innerHTML='<i style="width:'+Math.max(0,state.scores[id])+'%"></i>';
  if(state.moments[id]) node("span","✦ wspólna scena",card).className="interaction-badge";
  if(state.messages[id]) node("span","▣ wiadomość",card).className="interaction-badge";
  if(state.route===id) node("small","♡ Umówione spotkanie",card);
 });
 button("Wróć do gry",play);
}
menu();
</script>
</html>
