<main id="app"><header><div class="brand">♡ Zauroczeni</div><div class="header-actions"><button id="home-btn">⌂ <span>Mapa</span></button><button id="phone-btn">▣ <span>Telefon</span></button><button id="account-btn">♙ <span>Konto</span></button></div></header><section id="screen"></section></main><div id="overlay" class="overlay" aria-hidden="true"></div>

<script>
"use strict";
const screen=document.querySelector("#screen"),overlay=document.querySelector("#overlay");const saveKey="zauroczeni.simple.v2",sessionKey="zauroczeni.supabase.session.v1";const supabaseConfig={url:window.ALCARA_CONFIG?.url||"",anonKey:window.ALCARA_CONFIG?.publishableKey||""};let state=null,cloudTimer;
const people=[
 {name:"Martyna",role:"uważna obserwatorka",color:"#315f81",soft:"#bad9e7",image:"assets/characters/martyna-cutout.png",intro:"Zna cudze sekrety, ale własne chowa za spokojnym uśmiechem.",questions:[
  ["Kiedy ktoś powierza ci sekret, co robisz?",[["Chronię go, nawet gdy mnie to kosztuje.","Martyna kiwa głową. „Właśnie takiej odpowiedzi potrzebowałam.”",3,1],["Pytam, czy mogę komuś pomóc.","„Rozsądnie. Sekret nie zawsze musi być ciężarem jednej osoby.”",2,1],["Wszystko zależy od tego, jak ciekawy jest sekret.","Martyna mruży oczy. „To zabrzmiało trochę niebezpiecznie.”",-1,0]]],
  ["Mam fragment nagrania. Słychać na nim czyjś płacz. Odtworzyć go grupie?",[["Nie bez zgody tej osoby.","„Dobrze. Najpierw człowiek, potem śledztwo.”",3,1],["Tylko osobom, którym ufamy.","„Może. Ale to nadal ryzyko.”",1,1],["Tak, każda wskazówka się liczy.","„Nie chcę wygrać kosztem kogoś niewinnego.”",-2,0]]],
  ["Dlaczego tak bardzo chcesz zatrzymać publikację?",[["Bo na nagraniu jest też twój głos?","Martyna milknie. „Tak. Powiedziałam coś, czego jeszcze nie umiem powtórzyć na głos.”",3,1],["Bo boisz się reakcji szkoły?","„Trochę. Ale bardziej boję się zranić jedną konkretną osobę.”",2,1],["Bo lubisz kontrolować sytuację?","„Może odrobinę. Nie wszystko jednak da się kontrolować.”",0,0]]],
  ["Gdy to się skończy… zostaniesz ze mną chwilę?",[["Zostanę tak długo, jak chcesz.","Martyna uśmiecha się. „W takim razie nie boję się piątku.”",4,0],["Jasne. Możemy po prostu pomilczeć.","„Z tobą cisza nie jest niezręczna.”",3,0],["Jeśli nie będę mieć innych planów.","„Rozumiem. Nie chcę cię zatrzymywać.”",0,0]]]]},
 {name:"Adam",role:"technik szkolnego radia",color:"#347b7b",soft:"#bfe1dd",image:"assets/characters/adam-cutout.png",intro:"Potrafi naprawić każdy kabel, ale nie każdą rozmowę.",questions:[
  ["Wolisz wiedzieć wszystko czy mieć święty spokój?",[["Wiedzieć, ale nie wykorzystywać tego przeciw ludziom.","„To brzmi jak instrukcja obsługi dobrego człowieka.”",3,1],["Czasem niewiedza naprawdę chroni.","„Rozumiem. Sam czasem odłączam powiadomienia.”",2,0],["Wiedza zawsze daje przewagę.","„I właśnie dlatego ten plik jest groźny.”",-1,0]]],
  ["Logi pokazują, że plik wrzucono z mojego komputera. Wierzysz mi?",[["Wierzę, ale sprawdźmy fakty razem.","Adam wypuszcza powietrze. „Dziękuję. Tego właśnie potrzebowałem.”",3,1],["Jeszcze nie wiem. Opowiedz wszystko od początku.","„Uczciwie. Mam kopię historii logowań.”",2,1],["Nie. Dowody są przeciwko tobie.","„Dowody bez kontekstu bywają pułapką.”",-2,0]]],
  ["Kto znał twoje hasło?",[["Ktoś, komu chciałeś zaimponować?","Adam czerwienieje. „Antek. Pokazałem mu panel radia.”",3,1],["Cała ekipa techniczna?","„Tylko ja i Piotr. A przynajmniej tak sądziłem.”",2,1],["Pewnie nikomu go nie podałeś.","„Niestety podałem. I teraz tego żałuję.”",0,0]]],
  ["Jeśli oczyścimy moje imię, dasz się zaprosić na kakao?",[["Tylko jeśli będzie bardzo słodkie.","Adam śmieje się. „Zrobię najbardziej przesadzone kakao w Warszawie.”",4,0],["Tak. Bez rozmów o hasłach.","„Umowa stoi.”",3,0],["Najpierw uratujmy radio.","„Jasne. Jedno po drugim.”",1,0]]]]},
 {name:"Kasia",role:"królowa fotobudki",color:"#b34c88",soft:"#f2c8df",image:"assets/characters/kasia-cutout.png",intro:"Żartuje pierwsza, bo nie chce, żeby ktoś zauważył jej tremę.",questions:[
  ["Co wybierasz: tragiczny film czy świetną rozmowę po nim?",[["Tragiczny film i rozmowę z tobą.","„To była bezczelnie dobra odpowiedź.”",4,0],["Rozmowę. Film możemy wyłączyć.","„Dokładnie! Wreszcie ktoś rozumie kino.”",3,0],["Dobry film i ciszę.","„Okej, szanuję… trochę.”",0,0]]],
  ["Na nagraniu ktoś mówi, że udawanie pewności siebie męczy. Myślisz, że to ja?",[["Tak, ale nie musisz przy mnie niczego udawać.","Kasia odwraca wzrok. „Przy tobie faktycznie jest łatwiej.”",3,1],["Nie zgaduję cudzych sekretów.","„Dobra odpowiedź. Naprawdę.”",2,1],["Nie, ty zawsze jesteś pewna siebie.","„Czyli moja maska działa aż za dobrze.”",0,0]]],
  ["Znalazłam kartę pamięci w fotobudce. Oddać ją dyrekcji?",[["Najpierw sprawdźmy, czy należy do naszej sprawy.","„Na etui jest logo szkolnego radia. Mamy trop.”",3,1],["Tak, nie powinniśmy jej otwierać.","„Bezpiecznie, ale możemy stracić jedyną wskazówkę.”",1,0],["Wrzućmy zawartość na grupę.","„Nie. Nie powtórzymy błędu anonimowego autora.”",-2,0]]],
  ["Zrobimy zdjęcie, kiedy już będzie po wszystkim?",[["Tak. Jedno normalne i jedno tylko dla nas.","„To drugie schowam w portfelu.”",4,0],["Tak, z całą ekipą.","„Będzie chaotycznie. Idealnie.”",2,0],["Nie przepadam za zdjęciami.","„Spoko. Mogę zapamiętać ten moment bez aparatu.”",1,0]]]]},
 {name:"Antosia",role:"rysowniczka z ostatniej ławki",color:"#8b627c",soft:"#e5cbd9",image:"assets/characters/antosia-cutout.png",intro:"Zauważa w ludziach rzeczy, których oni sami nie widzą.",questions:[
  ["Gdybym cię narysowała, jaki szczegół mam zapamiętać?",[["To, jak na ciebie patrzę.","Antosia chowa uśmiech za szkicownikiem. „Trudne, ale spróbuję.”",4,0],["Moje dłonie. Dużo nimi mówię.","„Dobre. Ręce nigdy nie kłamią.”",3,0],["Najlepiej niczego nie upiększaj.","„Nigdy tego nie robię. Szukam prawdy, nie ideału.”",2,0]]],
  ["Narysowałam osobę przy komputerze radia. Pokazać szkic?",[["Tak, ale bez publicznego oskarżania.","„To tylko sylwetka. Czapka wygląda jak Antka.”",3,1],["Najpierw pokaż Adamowi.","„Dobry pomysł. Rozpozna układ sprzętu.”",2,1],["Wrzuć go wszystkim.","„Nie chcę urządzać polowania na człowieka.”",-1,0]]],
  ["Dlaczego byłaś wtedy pod studiem?",[["Nie musisz odpowiadać, jeśli to zbyt osobiste.","„Czekałam na Emozosię. Miałyśmy porozmawiać o czymś ważnym.”",3,1],["Czyli coś ukrywasz.","„Każdy coś ukrywa. To nie znaczy, że szkodzi.”",0,0],["Przypadek?","„Nie. Ale obiecuję, że nie dotykałam komputera.”",1,1]]],
  ["Mogę kiedyś dokończyć twój portret?",[["Tylko jeśli będziesz siedzieć bardzo blisko.","Antosia rumieni się. „To może utrudnić rysowanie.”",4,0],["Tak. Chcę zobaczyć siebie twoimi oczami.","„W takim razie pokażę ci wszystko, co widzę.”",3,0],["Może kiedyś.","„Szkicownik poczeka.”",1,0]]]]},
 {name:"Piotr",role:"głos szkolnego radia",color:"#4d94a3",soft:"#c7e2e5",image:"assets/characters/piotr-cutout.png",intro:"Pod żartami ukrywa lęk, że nikt nie słucha go naprawdę.",questions:[
  ["Masz dziesięć sekund anteny. Co mówisz całej szkole?",[["Żeby byli dla siebie trochę łagodniejsi.","„Krótko i celnie. Masz głos do radia.”",3,0],["Że nie wszystko musi być idealne.","„To powinienem puszczać sobie codziennie.”",3,0],["Że piątek powinien być wolny.","„Podpisuję petycję natychmiast.”",2,0]]],
  ["Intro anonimowego pliku brzmi jak mój tekst. Oskarżysz mnie?",[["Najpierw zapytam, komu go wysłałeś.","„Doboszowi. Miał zrobić wersję testową.”",3,1],["Nie. Ktoś mógł go skopiować.","„Dziękuję. W archiwum są moje stare szkice.”",2,1],["To wystarczający dowód.","„Właśnie tak rodzą się złe audycje i złe wyroki.”",-2,0]]],
  ["Chciałem zrobić audycję o rzeczach, których boimy się powiedzieć. To był zły pomysł?",[["Nie, jeśli każdy świadomie wyrazi zgodę.","„Właśnie tego zabrakło. Zgody.”",3,1],["Temat jest dobry, wykonanie fatalne.","„Boli, ale uczciwie.”",2,1],["Tak. Sekrety powinny zostać sekretami.","„Może. Ale czasem wypowiedziany lęk traci siłę.”",0,0]]],
  ["Zrobisz ze mną nową audycję — tylko naszą?",[["Tak. Pierwszy odcinek o nas.","Piotr na chwilę traci słowa. „To będzie mój ulubiony odcinek.”",4,0],["Tak, ale bez improwizowania.","„Obiecuję przygotować dwa scenariusze.”",3,0],["Wolę zostać słuchaczem.","„W takim razie będę mówił tak, żebyś chciał/chciała słuchać.”",1,0]]]]},
 {name:"Witek",role:"były sabotażysta",color:"#31566d",soft:"#bfd2dd",image:"assets/characters/witek-cutout.png",intro:"Zrobił coś głupiego i po raz pierwszy naprawdę chce to naprawić.",questions:[
  ["Czy człowiek zasługuje na drugą szansę?",[["Tak, jeśli bierze odpowiedzialność.","„To uczciwe. Nie proszę o zapomnienie.”",3,0],["Czasem. Czyny są ważniejsze niż słowa.","„W takim razie pokażę czynami.”",2,0],["Nie każdy.","„Rozumiem. Wiem, że zaufania nie da się wymusić.”",0,0]]],
  ["Widziałem ostrzeżenie o publikacji i je ukryłem. Dlaczego?",[["Bałeś się, że znowu cię oskarżą.","„Tak. I przez ten strach wszystko pogorszyłem.”",3,1],["Chciałeś chronić kogoś konkretnego.","„Błażeja. Myślałem, że to jego plik.”",3,1],["Bo nadal sabotujesz radio.","„Nie. Ale rozumiem, dlaczego tak myślisz.”",-1,0]]],
  ["Powinienem powiedzieć wszystkim od razu?",[["Tak. Prawda teraz będzie mniej bolesna niż później.","„Zrobię to. Zostań obok?”",3,1],["Najpierw porozmawiaj z Błażejem.","„Dobrze. Razem powiemy reszcie.”",2,1],["Lepiej nic nie mówić.","„Nie. Milczenie już raz nas tu doprowadziło.”",-2,0]]],
  ["Jeśli naprawdę się zmienię… pozwolisz mi być blisko?",[["Już jesteś bliżej, niż myślisz.","Witek uśmiecha się niepewnie. „Nie zmarnuję tego.”",4,0],["Powoli. Bez obietnic na skróty.","„Powoli mi pasuje.”",3,0],["Możemy zostać znajomymi.","„To też jest druga szansa.”",1,0]]]]},
 {name:"Błażej",role:"chodzący chaos",color:"#862d38",soft:"#e4bec3",image:"assets/characters/blazej-cutout.png",intro:"Robi hałas, gdy boi się, że nikt go nie zauważy.",questions:[
  ["Co jest gorsze: skłamać czy przemilczeć prawdę?",[["Zależy, kogo tym chronisz i krzywdzisz.","„Nienawidzę rozsądnych odpowiedzi. Ta jest dobra.”",3,0],["Skłamać. Milczenie można jeszcze przerwać.","„Czyli mam jeszcze szansę.”",2,0],["To dokładnie to samo.","„Może. Ale jedno robiłem częściej.”",1,0]]],
  ["Zmieniłem nazwę pliku na „PIĄTEK_FINAL”. Dla żartu. Wściekasz się?",[["Tak, ale ważniejsze jest, co zrobisz teraz.","„Pomogę go zatrzymać. Bez kolejnych żartów.”",3,1],["Trochę. To uruchomiło harmonogram.","„Wiem. Głupi żart stał się prawdziwym problemem.”",2,1],["Nie wierzę, że to był żart.","„Nie mam dobrego sposobu, żeby to udowodnić.”",0,0]]],
  ["Dlaczego ciągle wszystko obracam w żart?",[["Bo boisz się, że szczerość da komuś przewagę.","Błażej cichnie. „Dokładnie.”",3,1],["Bo lubisz uwagę.","„Też. Ale nie tylko dlatego.”",1,0],["Bo nie traktujesz nikogo poważnie.","„Czasem nie traktuję poważnie nawet siebie.”",-1,0]]],
  ["Jeśli przeproszę wszystkich, zacznę od ciebie. Co odpowiesz?",[["Że chcę poznać prawdziwego Błażeja.","„To ryzykowna decyzja. Ale podoba mi się.”",4,0],["Że przyjmuję przeprosiny, jeśli będą szczere.","„Będą. Pierwszy raz bez żartu.”",3,0],["Że jeszcze nie jestem gotowy/gotowa.","„Poczekam. Tym razem serio.”",1,0]]]]},
 {name:"Dobosz",role:"autor wersji testowej",color:"#9d3530",soft:"#e7c0b9",image:"assets/characters/dobosz-cutout.png",intro:"Jego eksperyment dźwiękowy przypadkiem stał się centrum całej afery.",questions:[
  ["Czy sztuka może używać cudzych historii?",[["Tylko za zgodą osób, do których należą.","„Masz rację. Pomyliłem inspirację z pozwoleniem.”",3,1],["Jeśli nikt nie rozpozna bohaterów.","„Myślałem tak samo. Okazało się, że głos wystarczy.”",1,0],["Sztuka nie powinna mieć ograniczeń.","„Brzmi pięknie, dopóki to nie twój sekret.”",-1,0]]],
  ["To ja zmontowałem plik, ale miał być prywatnym szkicem. Wierzysz mi?",[["Tak. Metadane pokażą, kiedy powstał szkic.","„Mam oryginalny projekt z datą. To nasza najważniejsza wskazówka.”",3,2],["Wierzę, jeśli pokażesz surowe nagrania.","„Pokażę, ale tylko zainteresowanym osobom.”",2,1],["Nie. Autor zawsze odpowiada za dzieło.","„Odpowiadam za montaż. Nie za publikację — ale rozumiem.”",0,0]]],
  ["Dlaczego w ogóle go zrobiłem?",[["Chciałeś, żeby ludzie usłyszeli, że nie są sami.","„Tak. Tylko zapomniałem zapytać, czy chcą być usłyszani.”",3,1],["Chciałeś wygrać konkurs radiowy.","„Też, ale to nie była najważniejsza rzecz.”",1,0],["Dla uwagi.","„Nie. Wolałem pozostać za kulisami.”",0,0]]],
  ["Pomożesz mi zrobić nową wersję — uczciwą?",[["Tak. Każdy sam nagra to, co chce powiedzieć.","„Właśnie tak powinno być od początku. Z tobą obok dam radę.”",4,0],["Tak, ale najpierw usuńmy stary plik.","„Zgoda. Nowy początek bez starego ciężaru.”",3,0],["Nie chcę brać w tym udziału.","„Rozumiem. I tak naprawię swój błąd.”",1,0]]]]},
 {name:"Emozosia",role:"montażystka z własnym stylem",color:"#496d2d",soft:"#ceddbb",image:"assets/characters/emozosia-cutout.png",intro:"Wygląda jak kolorowy alarm, ale mówi ciszej niż większość klasy.",questions:[
  ["Co robisz, kiedy wszystko jest za głośne?",[["Szukam osoby, przy której mogę być cicho.","„To chyba najrzadszy rodzaj bezpieczeństwa.”",4,0],["Zakładam słuchawki i znikam.","„Klasyka. Mam playlistę na dokładnie takie dni.”",3,0],["Robię jeszcze większy hałas.","„Odważna strategia. Męcząca, ale odważna.”",1,0]]],
  ["Dodałam do szkicu muzykę. Czy to czyni mnie współwinną?",[["Nie publikacji, ale jesteś częścią historii.","„Mogę pomóc znaleźć wersję projektu sprzed zmian.”",3,1],["Jeśli wiedziałaś o sekretach — trochę tak.","„Wiedziałam, że są osobiste. Nie wiedziałam czyje.”",2,1],["Tak. Powinnaś była to zatrzymać.","„Może. Żałuję, że nie zapytałam.”",0,0]]],
  ["Antosia czekała na mnie pod studiem. Wiesz dlaczego?",[["Chciała ci powiedzieć, że jej na tobie zależy?","Emozosia uśmiecha się krzywo. „Blisko. Bała się, że stracimy przyjaźń.”",3,1],["Miałyście wspólnie montować plik.","„Nie. Miałyśmy wspólnie go usunąć.”",3,1],["Nie chcę zgadywać.","„Dobrze. Sama ci powiem: chciałyśmy zatrzymać publikację.”",2,1]]],
  ["Kiedy to się skończy, posłuchasz ze mną jednej piosenki?",[["Jednej, ale bardzo blisko ciebie.","„Możliwe, że wybiorę najdłuższą piosenkę świata.”",4,0],["Całego albumu.","„Okej. To już brzmi jak randka.”",4,0],["Podeślij mi link.","„Wyślę. Ale na żywo brzmi lepiej.”",1,0]]]]},
 {name:"Antek",role:"sprawca jednego kliknięcia",color:"#8a5b28",soft:"#e2d0ab",image:"assets/characters/antek-cutout.png",intro:"Chciał tylko pokazać teaser. Jedno kliknięcie zaplanowało katastrofę.",questions:[
  ["Czy przyznajesz się od razu, kiedy coś zepsujesz?",[["Staram się, nawet jeśli się boję.","„Może nauczysz mnie tej sztuczki.”",3,0],["Najpierw próbuję to naprawić.","„Czyli dokładnie jak ja. To bywa ryzykowne.”",2,0],["Dopiero gdy ktoś zauważy.","„Uczciwie. Niezbyt dobrze, ale uczciwie.”",0,0]]],
  ["Kliknąłem „zaplanuj”, myśląc, że ustawiam prywatny podgląd. Co teraz?",[["Pokaż dokładnie, co zrobiłeś. Cofniemy to razem.","„Dobra. Panel jest na koncie Adama.”",3,2],["Powiedz wszystkim i przeproś.","„Powiem. Ale najpierw chcę mieć rozwiązanie.”",2,1],["Uciekaj, zanim się dowiedzą.","„Kusiło mnie. Ale już nie chcę uciekać.”",-2,0]]],
  ["Dlaczego nie powiedziałem wcześniej?",[["Bałeś się zawieść Adama.","„Tak. Zaufał mi, a ja kliknąłem bez czytania.”",3,1],["Liczyłeś, że problem sam zniknie.","„Dokładnie. Problemy rzadko mają tę uprzejmość.”",2,1],["Nie obchodziły cię konsekwencje.","„Obchodziły. Właśnie dlatego zamarłem.”",0,0]]],
  ["Po wszystkim pójdziemy gdzieś, gdzie nie ma komputerów?",[["Tak. Możesz wybrać miejsce.","„Park, gorąca czekolada i absolutnie zero przycisków.”",4,0],["Tak, ale telefon zostaje w kieszeni.","„Trudne, lecz wykonalne.”",3,0],["Najpierw naprawmy sytuację.","„Słusznie. Potem zaproszenie nadal aktualne.”",1,0]]]]}
];

function relationHearts(score){const count=Math.max(0,Math.min(5,Math.floor(score/3)));return "♥".repeat(count)+"♡".repeat(5-count)}function hub(){if(!state){menu();return}blank();const view=el("div","",screen);view.className="view";const head=el("section","",view);head.className="panel hub-head";const copy=el("div","",head);copy.className="hub-copy";el("span","Warszawa · tydzień przed publikacją",copy).className="eyebrow";el("h2","Mapa spotkań",copy);el("p","Wybierz lokację, zobacz kto tam czeka i rozpocznij rozmowę. Każda osoba zna inny fragment historii pliku „PIĄTEK_FINAL”.",copy);const finished=state.completed.filter(Boolean).length;const progress=el("div","",head);progress.className="case-progress";el("strong",finished+" / "+people.length+" rozmów",progress);const meter=el("div","",progress);meter.className="meter";el("i","",meter).style.width=(finished/people.length*100)+"%";el("small",state.clues+" tropów",progress);if(finished>=6&&!state.finale)btn("Rozwiąż sprawę →",finale,progress,"primary");if(state.finale)btn("Zobacz zakończenie",finale,progress,"primary");const layout=el("div","",view);layout.className="map-layout";const board=el("section","",layout);board.className="map-board";el("span","Kliknij pinezkę, aby wybrać miejsce",board).className="map-legend";const side=el("aside","",layout);side.className="panel location-panel";const pins=[];locations.forEach((location,index)=>{const pin=btn("",()=>showLocation(index),board,"map-pin");pin.style.left=location.x+"%";pin.style.top=location.y+"%";const icon=el("span","",pin);icon.className="pin-icon";el("span",location.icon,icon);const label=el("span","",pin);el("strong",location.name,label);el("small",location.people.length+" "+(location.people.length===1?"osoba":"osoby"),label);pins.push(pin)});function showLocation(index){state.lastLocation=index;save();pins.forEach((pin,i)=>pin.classList.toggle("active",i===index));side.replaceChildren();const location=locations[index];el("span","Lokacja",side).className="eyebrow";el("h2",location.icon+" "+location.name,side);el("p",location.detail,side);const list=el("div","",side);list.className="location-people";location.people.forEach(personIndex=>{const person=people[personIndex];const card=btn("",()=>talk(personIndex),list,"location-person");const img=el("img","",card);img.src=person.image;img.alt=person.name;const info=el("span","",card);el("strong",person.name,info);el("span",relationHearts(state.relations[personIndex]),info).className="hearts";el("small",person.role+" · "+state.progress[personIndex]+"/4 pytań",info);if(state.completed[personIndex])el("small","✓ Rozmowa ukończona",info)});if(!location.people.length)el("div","Nikogo tu teraz nie ma.",list).className="location-empty"}showLocation(Number.isInteger(state.lastLocation)?state.lastLocation:0)}
function talk(index){const person=people[index],step=state.progress[index];blank();const view=el("div","",screen);view.className="talk";view.style.setProperty("--accent",person.color);view.style.setProperty("--accent-soft",person.soft);const portrait=el("section","",view);portrait.className="panel portrait-panel";const img=el("img","",portrait);img.src=person.image;img.alt=person.name;const tag=el("div","",portrait);tag.className="portrait-tag";el("strong",person.name,tag);el("span",person.role,tag);const dialogue=el("section","",view);dialogue.className="panel dialogue";if(step>=person.questions.length){el("span","Rozmowa zakończona",dialogue).className="eyebrow";el("blockquote",endingText(index),dialogue);el("div","Relacja: "+relationHearts(state.relations[index]),dialogue).className="affinity-pop";const actions=el("div","",dialogue);actions.className="talk-actions";btn("← Wróć do obsady",hub,actions,"primary");return}el("div","Pytanie "+(step+1)+" z 4 · "+person.intro,dialogue).className="question-count";const q=person.questions[step];el("blockquote","„"+q[0]+"”",dialogue);const choices=el("div","",dialogue);choices.className="choices";q[1].forEach((answer,i)=>{const choice=btn(answer[0],()=>answerQuestion(index,answer,dialogue,choices),choices,"choice");choice.dataset.key=String.fromCharCode(65+i)})}function answerQuestion(index,answer,dialogue,choices){choices.querySelectorAll("button").forEach(b=>b.disabled=true);state.relations[index]+=answer[2];state.clues+=answer[3]||0;state.answers[index].push(answer[0]);state.progress[index]++;if(state.progress[index]>=4)state.completed[index]=true;save();const reply=el("div","",dialogue);reply.className="reply";el("strong",people[index].name,reply);el("span",answer[1],reply);if(answer[2]>0)el("div","♥ Relacja "+(answer[2]>3?"mocno ":"")+"wzrosła",dialogue).className="affinity-pop";const actions=el("div","",dialogue);actions.className="talk-actions";btn(state.completed[index]?"Zakończ rozmowę":"Następne pytanie →",()=>talk(index),actions,"primary");btn("Wróć do obsady",hub,actions)}function endingText(index){const score=state.relations[index],name=people[index].name;if(score>=11)return name+" ufa ci bez zastrzeżeń. Między wami pojawiło się coś wyraźnie większego niż zwykła szkolna znajomość.";if(score>=6)return name+" traktuje cię jak bliską osobę i chce kontynuować tę relację po rozwiązaniu sprawy.";return name+" docenia rozmowę, choć między wami zostało jeszcze kilka niewypowiedzianych rzeczy."}
function finale(){if(!state)return;blank();const view=el("div","",screen);view.className="view finale";const card=el("section","",view);card.className="panel finale-card";el("span","Piątek · 15:57",card).className="eyebrow";el("h2","Ostatnia decyzja",card);if(state.finale){renderEnding(card);return}el("p","Układacie całą historię: Dobosz stworzył prywatny szkic. Piotr dał mu tekst. Emozosia dodała muzykę. Błażej zmienił nazwę pliku, a Antek omyłkowo zaplanował publikację z komputera Adama. Witek zauważył ostrzeżenie, lecz ze strachu je ukrył. Nikt nie chciał skrzywdzić całej grupy — każdy dołożył jednak mały błąd.",card);const options=el("div","",card);options.className="finale-options";[["A","Usuwamy plik i chronimy wszystkie sekrety","delete"],["B","Tworzymy nową audycję, ale każdy mówi tylko to, na co wyrazi zgodę","remake"],["C","Przekazujemy sprawę dyrekcji wraz z pełną historią","report"]].forEach(([key,text,type])=>{const b=btn(text,()=>chooseFinale(type),options,"choice");b.dataset.key=key})}function chooseFinale(type){state.finale=type;save();finale()}function renderEnding(card){const best=Math.max(...state.relations),index=state.relations.indexOf(best),person=people[index];const box=el("div","",card);box.className="ending";const texts={delete:"Plik znika minutę przed publikacją. Nie ma wielkiego zwycięstwa ani szkolnego skandalu — jest ulga i obietnica, że cudze słowa nie będą już niczyim materiałem bez zgody.",remake:state.clues>=8?"Zatrzymujecie stary plik, a tydzień później nadajecie audycję „Powiedz tylko tyle, ile chcesz”. Każdy sam wybiera swoje słowa. To najlepszy odcinek w historii radia.":"Nowa audycja powstaje ostrożnie i bez pośpiechu. Nie jest idealna, ale po raz pierwszy nikt nie czuje się wykorzystany.",report:"Dyrekcja zatrzymuje publikację. Zamiast jednej osoby ukarać za wszystko, szkoła wprowadza jasne zasady zgody i dostępu do studia."};el("h3","Sprawa zamknięta",box);el("p",texts[state.finale],box);el("h3","A potem zostajecie tylko we dwoje…",box);el("p",person.name+" czeka przed Smoczą 6. "+(best>=11?"Nie pyta, czy to randka — oboje już znacie odpowiedź.":"Proponuje spacer i kolejną rozmowę, tym razem bez tajemnicy do rozwiązania."),box);const img=el("img","",box);img.src=person.image;img.alt=person.name;img.style.cssText="display:block;width:100%;height:250px;object-fit:contain";const actions=el("div","",card);actions.className="talk-actions";btn("Wróć do obsady",hub,actions,"primary");btn("Zagraj od nowa",creator,actions)}
function phone(){if(!state){toast("Najpierw rozpocznij grę.");return}showModal(modal=>{modal.classList.add("phone");el("h2","Wiadomości",modal);const list=el("div","",modal);list.className="phone-list";people.forEach((person,i)=>{if(!state.progress[i])return;const msg=el("div","",list);msg.className="message";el("strong",person.name,msg);el("p",state.completed[i]?(state.relations[i]>=10?"Dzięki za dzisiejszą rozmowę. Chcę ci jeszcze coś powiedzieć na żywo ♡":"Dzięki, że mnie wysłuchałeś/wysłuchałaś."):"Możemy dokończyć rozmowę?",msg)});if(!list.children.length)el("p","Brak wiadomości. Porozmawiaj najpierw z kimś z obsady.",list);const keyboard=el("div","",modal);keyboard.className="keyboard";[10,9,7].forEach((count,row)=>{const r=el("div","",keyboard);r.className="key-row";for(let i=0;i<count;i++)el("i","",r);if(row===2)el("i","",r).className="space"})})}
function cloudEnabled(){return Boolean(supabaseConfig.url&&supabaseConfig.anonKey)}function cloudSession(){try{return JSON.parse(localStorage.getItem(sessionKey))}catch{return null}}async function supabaseRequest(path,options={},token=""){const headers={"Content-Type":"application/json","apikey":supabaseConfig.anonKey,"Authorization":"Bearer "+(token||supabaseConfig.anonKey),...(options.headers||{})};const response=await fetch(supabaseConfig.url.replace(/\/$/,"")+"/"+path,{...options,headers});const text=await response.text();let data=null;try{data=text?JSON.parse(text):null}catch{data=text}if(!response.ok)throw new Error(data?.msg||data?.message||data?.error_description||"Błąd połączenia z Supabase");return data}function scheduleCloudSave(){const session=cloudSession();if(!cloudEnabled()||!session?.access_token||!session?.user?.id)return;clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>cloudSave().catch(()=>{}),700)}async function cloudSave(){const session=cloudSession();if(!session?.access_token||!state)return;await supabaseRequest("rest/v1/game_saves?on_conflict=user_id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates"},body:JSON.stringify({user_id:session.user.id,save_data:state,updated_at:new Date().toISOString()})},session.access_token)}async function cloudLoad(){const session=cloudSession();const rows=await supabaseRequest("rest/v1/game_saves?select=save_data&user_id=eq."+encodeURIComponent(session.user.id)+"&limit=1",{},session.access_token);const remote=rows?.[0]?.save_data;if(remote?.version===2){state=remote;localStorage.setItem(saveKey,JSON.stringify(state));return true}return false}
function account(){showModal(modal=>{el("h2","Konto i zapis",modal);const box=el("div","",modal);box.className="account-box";if(!cloudEnabled()){el("p","Supabase nie jest skonfigurowany.",box);return}const session=cloudSession();if(session?.access_token){el("div","Zalogowano jako "+(session.user?.email||"gracz"),box).className="account-status";const actions=el("div","",box);actions.className="account-actions";btn("Zapisz w chmurze",async()=>{await cloudSave();toast("Zapis wysłany do chmury.")},actions,"primary");btn("Pobierz zapis",async()=>{const ok=await cloudLoad();toast(ok?"Zapis pobrany.":"Brak zapisu w chmurze.");if(ok){closeModal();hub()}},actions);btn("Wyloguj",()=>{localStorage.removeItem(sessionKey);closeModal();toast("Wylogowano.")},actions);return}const email=el("input","",box);email.type="email";email.placeholder="E-mail";const password=el("input","",box);password.type="password";password.placeholder="Hasło (minimum 6 znaków)";password.minLength=6;const status=el("div","Zaloguj się albo utwórz konto.",box);status.className="account-status";const actions=el("div","",box);actions.className="account-actions";btn("Zaloguj się",async()=>{try{const data=await supabaseRequest("auth/v1/token?grant_type=password",{method:"POST",body:JSON.stringify({email:email.value,password:password.value})});localStorage.setItem(sessionKey,JSON.stringify(data));if(state)await cloudSave();closeModal();toast("Zalogowano i zsynchronizowano zapis.")}catch(error){status.textContent=error.message}},actions,"primary");btn("Załóż konto",async()=>{try{const data=await supabaseRequest("auth/v1/signup",{method:"POST",body:JSON.stringify({email:email.value,password:password.value})});if(data?.access_token)localStorage.setItem(sessionKey,JSON.stringify(data));status.textContent=data?.access_token?"Konto gotowe.":"Sprawdź e-mail i potwierdź konto."}catch(error){status.textContent=error.message}},actions)})}
function showModal(render){overlay.replaceChildren();overlay.className="overlay show";overlay.setAttribute("aria-hidden","false");const modal=el("section","",overlay);modal.className="modal";btn("×",closeModal,modal,"close");render(modal)}function closeModal(){overlay.className="overlay";overlay.setAttribute("aria-hidden","true");overlay.replaceChildren()}document.querySelector("#home-btn").addEventListener("click",()=>state?hub():menu());document.querySelector("#phone-btn").addEventListener("click",phone);document.querySelector("#account-btn").addEventListener("click",account);overlay.addEventListener("click",event=>{if(event.target===overlay)closeModal()});document.addEventListener("keydown",event=>{if(event.key==="Escape")closeModal()});menu();
