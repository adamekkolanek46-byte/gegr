name: Build Metro Mistrz PL

on:
  workflow_dispatch:
  push:
    branches: [metro-mistrz]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle assembleDebug --stacktrace
        working-directory: metro-mistrz
      - uses: actions/upload-artifact@v4
        with:
          name: Metro-Mistrz-PL-APK
          path: metro-mistrz/app/build/outputs/apk/debug/app-debug.apk
