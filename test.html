<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf9f6">
  <meta name="description" content="grupa genzie — kolor i dobra energia w prostej formie.">
  <title>grupa genzie</title>
  <style>
    :root { color-scheme: light; background: #faf9f6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 240px; }
    main {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(24px, 7vw, 100px);
      overflow: hidden;
    }
    h1 {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif;
      font-weight: 900;
      text-align: center;
    }
    .group {
      margin-bottom: clamp(10px, 2vw, 24px);
      color: #615c70;
      font-size: clamp(18px, 2.8vw, 36px);
      font-weight: 700;
      letter-spacing: .22em;
      padding-left: .22em;
    }
    .name {
      display: flex;
      font-size: clamp(60px, 18vw, 260px);
      letter-spacing: -.065em;
      line-height: .95;
      padding: .08em .08em .15em 0;
    }
    .name span { display: inline-block; }
    .name span:nth-child(1) { color: #ef6686; transform: rotate(-7deg); }
    .name span:nth-child(2) { color: #ed9b42; transform: rotate(5deg) translateY(-.025em); }
    .name span:nth-child(3) { color: #83ae77; transform: rotate(-4deg); }
    .name span:nth-child(4) { color: #6baed6; transform: rotate(5deg) translateY(.025em); }
    .name span:nth-child(5) { color: #a28bc7; transform: rotate(-5deg) translateY(-.04em); }
    .name span:nth-child(6) { color: #e582aa; transform: rotate(6deg); }
    @media (prefers-reduced-motion: no-preference) {
      h1 { animation: arrive 850ms cubic-bezier(.2,.8,.2,1) both; }
      @keyframes arrive {
        from { opacity: 0; translate: 0 16px; }
        to { opacity: 1; translate: 0 0; }
      }
    }
    @media (max-width: 360px) {
      main { padding: 16px; }
      .name { font-size: 19vw; }
    }
  </style>
</head>
<body>
  <main>
    <h1 aria-label="grupa genzie">
      <span class="group" aria-hidden="true">grupa</span>
      <span class="name" aria-hidden="true"><span>g</span><span>e</span><span>n</span><span>z</span><span>i</span><span>e</span></span>
    </h1>
  </main>
</body>
</html>
